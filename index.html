    <script>
        // Browsers without container queries (Safari before 16, Firefox before 110) get the stylesheet's
        // @container page steps as window-width steps instead: on a phone the page frame is 20px narrower
        // than the window
        window.addContainerFallback = function (force) {
            if (!force && window.CSS && CSS.supports('container-type', 'inline-size')) return;
            var link = document.querySelector('link[href^="css/style.css"]');
            fetch(link.getAttribute('href')).then(function (response) { return response.text(); }).then(function (css) {
                // The whole stylesheet, so every rule keeps its place in the cascade
                var style = document.createElement('style');
                style.textContent = css
                    .replace(/@container page \((max|min)-width: (\d+)px\)/g,
                        function (match, side, width) { return '@media only screen and (' + side + '-width: ' + (+width + 20) + 'px)'; })
                    .replace(/url\(\.\.\//g, 'url(');  // image paths, now relative to the page
                link.parentNode.insertBefore(style, link.nextSibling);
                link.disabled = true;
            });
        };
        window.addContainerFallback();
    </script>

        <!-- React code -->
        <script type="text/babel">
            const { useState, useEffect, useLayoutEffect, useRef } = React;
			const { DragDropContext, Droppable, Draggable } = ReactBeautifulDnd;
			const SAVED_STATE_KEY = 'ats-cheatsheet:v1';

			// Listen for a window event (e.g. 'speciesSelection', 'ingredientSelection') while mounted.
			// The latest handler is always used, so it can read current state.
			const useWindowEvent = (eventName, handler) => {
				const handlerRef = useRef(handler);
				handlerRef.current = handler;
				useEffect(() => {
					const listener = (event) => handlerRef.current(event);
					window.addEventListener(eventName, listener);
					return () => window.removeEventListener(eventName, listener);
				}, [eventName]);
			};

			// Selects a good or species in the upper half by clicking its icon. A service need
			// (Religion) selects the good that meets it; a name with no icon does nothing.
			const selectInGrid = (name) => {
				const icon = document.getElementById(NEEDTRANS[name] || name);
				if (icon) icon.click();
			};

			// Whether the page frame (div.content, which the stylesheet's container queries measure) is
			// narrower than `width`, measured before the first paint and kept up to date
			const usePageNarrowerThan = (width) => {
				const [narrower, setNarrower] = useState(false);
				useLayoutEffect(() => {
					const page = document.querySelector('div.content');
					if (!page) return undefined;
					const measure = () => {
						const style = getComputedStyle(page);
						setNarrower(page.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight) < width);
					};
					measure();
					if (typeof ResizeObserver === 'undefined') {
						window.addEventListener('resize', measure);
						return () => window.removeEventListener('resize', measure);
					}
					const observer = new ResizeObserver(measure);
					observer.observe(page);
					return () => observer.disconnect();
				}, [width]);
				return narrower;
			};

			const loadSavedState = () => {
				try {
					return JSON.parse(localStorage.getItem(SAVED_STATE_KEY)) || {};
				} catch (error) {
					return {};
				}
			};

			const saveState = (changes) => {
				try {
					localStorage.setItem(SAVED_STATE_KEY, JSON.stringify({ ...loadSavedState(), ...changes }));
				} catch (error) {
					// The cheatsheet still works when browser storage is unavailable.
				}
			};

			const resetSavedState = () => {
				try {
					localStorage.removeItem(SAVED_STATE_KEY);
				} catch (error) {
					// Reload still restores defaults when browser storage is unavailable.
				}
				window.location.reload();
			};
            
            // Parse the json string from the goods.json file that we loaded in the html head section
            const GOODS = JSON.parse(goods_data);
			const BUILDINGS = JSON.parse(buildings_data);
			const goodDisplayName = (id) => (GOODS[id] && GOODS[id].displayName) || id;
            // Grouped and ordered like the wiki's Complex Needs table (housing is not shown here)
            const NEED_GROUPS = [
                { name: 'Complex Foods', needs: ['Jerky', 'Porridge', 'Skewers', 'Biscuits', 'Pie', 'Pickled Goods', 'Paste'] },
                { name: 'Clothing', needs: ['Coats', 'Boots'] },
                { name: 'Services', needs: ['Leisure', 'Brawling', 'Religion', 'Education', 'Luxury', 'Treatment'] },
            ];
            const NEEDS = NEED_GROUPS.flatMap(group => group.needs);
			const NEEDTRANS = {'Treatment': 'Tea', 'Leisure': 'Ale', 'Luxury': 'Wine', 'Brawling': 'Training Gear', 'Religion': 'Incense', 'Education': 'Scrolls'}
            const SPECIES = {
                'Human': ['Porridge', 'Biscuits', 'Pie', 'Coats', 'Leisure', 'Religion'],
                'Beaver': ['Pickled Goods', 'Biscuits', 'Coats', 'Leisure', 'Education', 'Luxury'],
                'Harpy': ['Jerky', 'Education', 'Coats', 'Treatment', 'Boots', 'Paste'],
                'Lizard': ['Jerky', 'Pickled Goods', 'Pie', 'Skewers', 'Brawling', 'Boots'],
                'Fox': ['Porridge', 'Pickled Goods', 'Treatment', 'Skewers', 'Religion', 'Boots'],
				'Frog': ['Porridge', 'Pie', 'Brawling', 'Religion', 'Luxury', 'Boots', 'Paste'],
				'Bat': ['Biscuits', 'Paste', 'Skewers', 'Coats', 'Brawling', 'Education']
            }
			const overlappingNeeds = {};
			for (const species in SPECIES) {
			  const speciesNeeds = SPECIES[species];
			  for (const need of speciesNeeds) {
				if (!(need in overlappingNeeds)) {
				  overlappingNeeds[need] = [];
				}
				overlappingNeeds[need].push(species);
			  }
			}
			const MAX_SPECIES = 4; // 4 only with the Sacred Grove World Map modifier
			const SACRED_GROVE_WARNING = '4 species is only possible with the Sacred Grove World Map modifier.';

			// Shown when exactly 4 species are selected. Focusable so the tooltip also opens on tap.
			const SacredGroveWarning = ({ count }) => count === MAX_SPECIES ? (
				<span className="sacred-grove-warning" tabIndex={0} role="note" aria-label={SACRED_GROVE_WARNING} data-tooltip={SACRED_GROVE_WARNING}>
					<i className="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
				</span>
			) : null;

			// Tint color behind each need in the Species Needs grid, using in-game perk colors.
			const SPECIES_COLORS = ['var(--ats-color-purple-perk)', 'var(--ats-color-orange-perk)', 'var(--ats-color-green-perk)', 'var(--ats-color-blue-perk)'];
			const TINT_ALPHA = 0.4; // the tint's opacity; its 1px edge is opaque

			// Colors are assigned in list order, skipping colors that are already assigned to selected species.
			const assignSpeciesColors = (selection, previous = {}) => {
				const colors = {};
				for (const name of selection) {
					const color = previous[name];
					if (Number.isInteger(color) && color >= 0 && color < MAX_SPECIES && !Object.values(colors).includes(color)) colors[name] = color;
				}
				for (const name of selection) {
					if (!(name in colors)) colors[name] = SPECIES_COLORS.findIndex((_, i) => !Object.values(colors).includes(i));
				}
				return colors;
			};

			// Tint wedges for 2-4 species, in reading order (left to right, then the bottom), in degrees clockwise from the top.
			const NEED_WEDGES = {
				2: [[180, 360], [0, 180]],
				3: [[240, 360], [0, 120], [120, 240]],
				4: [[270, 360], [0, 90], [180, 270], [90, 180]],
			};
			// Background tint reaches further for each species that wants the need.
			const NEED_REACH = [0, 0.35, 0.6, 0.8, 1];
			const NEED_BLEND = 6; // degrees each wedge blends into its neighbors

			// colors: one color per species that wants the icon, in grid order, each drawn at the given opacity
			const tintGradient = (colors, alpha) => {
				const withAlpha = color => alpha === 1 ? color : `rgb(from ${color} r g b / ${alpha})`;
				if (colors.length === 1) return `linear-gradient(${withAlpha(colors[0])}, ${withAlpha(colors[0])})`;
				const wedges = NEED_WEDGES[colors.length].map(([from, to], i) => ({ from, to, color: withAlpha(colors[i]) })).sort((a, b) => a.from - b.from);
				const seam = `color-mix(in srgb, ${wedges[0].color}, ${wedges[wedges.length - 1].color})`;
				const stops = wedges.map(w => `${w.color} ${w.from + NEED_BLEND}deg ${w.to - NEED_BLEND}deg`).join(', ');
				return `conic-gradient(${seam} 0deg, ${stops}, ${seam} 360deg)`;
			};

			const speciesTintStyle = (colors, isSpecies) => colors.length === 0 ? null : {
				'--need-tint': tintGradient(colors, TINT_ALPHA),
				'--need-edge': tintGradient(colors, 1),
				'--need-reach': isSpecies ? 1 : NEED_REACH[colors.length],
			};

            const SPECIES_ICONS = {
                'Human': 'img/species/Human_Portrait.png',
                'Beaver': 'img/species/Beaver_Portrait.png',
                'Harpy': 'img/species/Harpy_Portrait.png',
                'Lizard': 'img/species/Lizard_Portrait.png',
                'Fox': 'img/species/Fox_Portrait.png',
				'Frog': 'img/species/Frog_Portrait.png',
				'Bat': 'img/species/Bat_Portrait.png',
                'Biscuits': 'img/goods/Icon_Resource_Biscuits.png',
                'Pie': 'img/goods/Icon_Resource_Pie.png',
                'Porridge': 'img/goods/Icon_Resource_Porridge.png',
                'Pickled Goods': 'img/goods/Icon_Resource_PickledGoods.png',
                'Jerky': 'img/goods/Icon_Resource_Jerky.png',
                'Skewers': 'img/goods/Icon_Resource_Skewers.png',
                'Luxury': 'img/needs/Icon_Need_Luxury.png',
                'Leisure': 'img/needs/Icon_Need_Leisure.png',
                'Treatment': 'img/needs/Icon_Service_Treatment.png',
                'Education': 'img/needs/Icon_Need_Education.png',
                'Brawling': 'img/needs/Icon_Need_Brawling.png',
                'Religion': 'img/needs/Icon_Service_Religion.png',
                'Coats': 'img/goods/Icon_Resource_Coats.png',
				'Boots': 'img/goods/Icon_Resource_Boots_1.png',
				'Paste': 'img/needs/Icon_Resource_Paste.png'
            }

            // --- Species affinity helpers (shared by NeedsGrid + BestBuildings) ---

            // Proficiency: 10% double-yield chance for a species working in a tagged
            // building. Fox "Forest" applies to glade events only, never buildings.
            const SPECIES_PROFICIENCY = {
                'Human': 'Farming',
                'Beaver': 'Woodworking',
                'Lizard': 'Meat production',
                'Harpy': 'Alchemy',
                'Fox': 'Forest',
                'Frog': 'Masonry',
                'Bat': 'Metallurgy'
            };

            const SPECIES_COMFORT = {
                'Human': 'Brewing',
                'Beaver': 'Engineering',
                'Lizard': 'Warmth',
                'Harpy': 'Tailoring',
                'Fox': 'Cooperation',
                'Frog': 'Rainwater'
            };

            const gradeStars = (grade) => grade ? (grade.split('★').length - 1) : 0;

            // Species in speciesList whose needs this product fulfills (foods/clothing
            // match directly; services match by need name or its consumed good)
            const productLikedBy = (productName, speciesList) => speciesList.filter(s =>
                SPECIES[s].includes(productName) || SPECIES[s].some(need => NEEDTRANS[need] === productName)
            );

            const proficientSpecies = (item, speciesList) => speciesList.filter(s =>
                item.proficiencyTags.includes(SPECIES_PROFICIENCY[s])
            );

            const comfortedSpecies = (item, speciesList) => speciesList.filter(s =>
                SPECIES_COMFORT[s] && item.comfortTags.includes(SPECIES_COMFORT[s])
            );

            const workerBonusCount = (item, speciesList) =>
                proficientSpecies(item, speciesList).length + comfortedSpecies(item, speciesList).length;

            // Higher = the building's output better matches the species' needs:
            // each liked product scores (species that want it) x (1 + recipe stars);
            // the base 1 means even a no-star recipe counts for fulfilling the need
            const affinityScore = (item, speciesList) => item.products.reduce((sum, p) => {
                const liked = productLikedBy(p.id, speciesList).length;
                return sum + liked * (1 + gradeStars(p.grade));
            }, 0);

            // Whether any product fulfills a need of the given species
            const hasLikedProduct = (item, speciesList) =>
                item.products.some(p => productLikedBy(p.id, speciesList).length > 0);

            const speciesPlural = (s) => s === 'Fox' ? 'Foxes' : `${s}s`;

            // Cleansed Haunted Ruins: one-of-a-kind ★★★ versions of regular buildings
            // https://wiki.hoodedhorse.com/Against_the_Storm/Ruins
            const isCleansedRuin = (buildingName) => /^(Flawless|Holy|Hallowed|Purified) /.test(buildingName);

            // Category and building order from the wiki's List of Buildings.
            // https://wiki.hoodedhorse.com/Against_the_Storm/Buildings
            // The Mine is listed under Resource Acquisition, and the Blight Post under City Buildings before the services.
            const CATEGORY_ORDER = ['Resource Acquisition', 'Food Production', 'Industry', 'City Buildings'];
            // Shorter button labels: "building" is implied in the Buildings table
            // On narrow screens two more shorten, dropping the word in .cat-label-extra (style.css)
            const CATEGORY_BUTTON_LABELS = {
                'Resource Acquisition': <><span className="cat-label-extra">Resource </span>Gathering</>,
                'Food Production': <>Food<span className="cat-label-extra"> Production</span></>,
                'City Buildings': 'City',
            };
            const categoryButtonLabel = (category) => CATEGORY_BUTTON_LABELS[category] || category;
            // Recipe grade for screen readers: '☆' is 0 stars, '★★' is 2 stars
            const gradeLabel = (grade) => {
                const stars = gradeStars(grade);
                return stars === 1 ? '1 star' : `${stars} stars`;
            };
            // The rating as three star slots, filled then hollow, for the small-screen building cards
            // (CSS shows it only there; the .grade beside it keeps the label for screen readers)
            const GradeBadge = ({ grade }) => {
                const stars = gradeStars(grade);
                return (
                    <span className="grade-badge" aria-hidden="true">
                        {'★'.repeat(stars)}
                        {stars < 3 && <span className="grade-badge-hollow">{'☆'.repeat(3 - stars)}</span>}
                    </span>
                );
            };
            // A product in the Buildings tables: icon, name and grade, the whole line selecting it in the
            // grid. `children` follow the grade (Best Buildings adds who needs it); `unwanted` dims it.
            const ProductLine = ({ product, unwanted = false, children }) => (
                <div className={`good-line${unwanted ? ' unwanted' : ''}`} onClick={() => selectInGrid(product.id)}>
                    <img alt={product.name} src={product.icon_path} width="30" height="30"/>
                    {product.grade && <GradeBadge grade={product.grade} />}
                    <span className="good-name"> {product.name}</span>
                    {product.grade && <span className="grade" role="img" aria-label={gradeLabel(product.grade)}>{product.grade}</span>}
                    {children}
                </div>
            );
            // A building cost: amount, icon and name, the whole line selecting the good in the grid
            const CostLine = ({ cost }) => (
                <div className="good-line" onClick={() => selectInGrid(cost.id)}>
                    <span className="good-amount">{cost.amount}</span>
                    <img alt={cost.name} src={cost.icon_path} width="30" height="30"/>
                    <span className="good-name"> {cost.name}</span>
                </div>
            );
            const BUILDING_ORDER = [
                "Woodcutters' Camp", "Stonecutters' Camp", "Harvesters' Camp", "Small Foragers' Camp", "Foragers' Camp",
                "Small Herbalists' Camp", "Herbalists' Camp", "Small Trappers' Camp", "Trappers' Camp", 'Small Fishing Hut',
                'Fishing Hut', 'Clay Pit', "Forester's Hut", 'Geyser Pump', 'Rain Collector', 'Advanced Rain Collector', 'Mine',
                'Small Farm', 'Hallowed Small Farm', 'Plantation', 'Herb Garden', 'Hallowed Herb Garden', 'Brineworks',
                'Greenhouse', 'Ranch', 'Field Kitchen', 'Bakery', 'Cookhouse', 'Smokehouse', 'Butcher', 'Beanery', 'Cellar',
                'Flawless Cellar', 'Cannery', 'Granary', 'Grill', 'Rain Mill', 'Flawless Rain Mill', 'Pantry', 'Apothecary',
                'Furnace', 'Homestead',
                'Crude Workstation', 'Makeshift Post', 'Workshop', 'Lumber Mill', 'Cooperage', 'Flawless Cooperage', 'Carpenter',
                'Cobbler', 'Weaver', 'Clothier', 'Leatherworker', 'Flawless Leatherworker', 'Brick Oven', 'Brickyard', 'Kiln',
                'Press', 'Provisioner', 'Stamping Mill', 'Smelter', 'Flawless Smelter', 'Smithy', 'Toolshop', 'Artisan',
                "Alchemist's Hut", 'Teahouse', 'Brewery', 'Flawless Brewery', 'Distillery', 'Tinctury', "Druid's Hut",
                "Flawless Druid's Hut", 'Tinkerer', 'Manufactory', 'Supplier', 'Scribe', 'Rainpunk Foundry', 'Finesmith',
                'Blight Post',
                'Tavern', 'Temple', 'Holy Temple', 'Monastery', 'Clan Hall', 'Forum', 'Guild House', 'Holy Guild House',
                'Market', 'Holy Market', 'Tea Doctor', 'Bath House', 'Feast Hall', 'Academy',
            ];
            // Anything not listed (e.g. a newly added building) goes after the listed ones, alphabetically
            const rankIn = (list) => {
                const ranks = new Map(list.map((name, index) => [name, index]));
                return (name) => ranks.has(name) ? ranks.get(name) : list.length;
            };
            const categoryRank = rankIn(CATEGORY_ORDER);
            const buildingRank = rankIn(BUILDING_ORDER);
            const compareCategory = (a, b) => categoryRank(a) - categoryRank(b) || a.localeCompare(b);
            const compareWikiOrder = (a, b) =>
                compareCategory(a.category, b.category)
                || buildingRank(a.building) - buildingRank(b.building)
                || a.building.localeCompare(b.building);
            const compareBuildingIds = (a, b) =>
                buildingRank(BUILDINGS[a].displayName) - buildingRank(BUILDINGS[b].displayName) || a.localeCompare(b);

            // Resource order from the wiki's List of Resources (by good ID; the wiki sorts each section by
            // internal name, so Dye, internally Pigment, comes after Leather). The waters aren't listed there.
            // https://wiki.hoodedhorse.com/Against_the_Storm/List_of_Resources
            const RESOURCE_ORDER = [
                'Berries', 'Eggs', 'Fish', 'Insects', 'Meat', 'Mushrooms', 'Roots', 'Vegetables',
                'Biscuits', 'Jerky', 'Pickled Goods', 'Paste', 'Pie', 'Porridge', 'Skewers',
                'Bricks', 'Fabric', 'Pipe', 'Planks', 'Parts', 'Hearth Parts',
                'Coats', 'Boots',
                'Ale', 'Incense', 'Scrolls', 'Tea', 'Training Gear', 'Wine',
                'Algae', 'Clay', 'Copper Ore', 'Crystalized Dew', 'Grain', 'Herbs', 'Leather', 'Plant Fibre', 'Reeds',
                'Resin', 'Salt', 'Scales', 'Stone',
                'Barrels', 'Copper Bar', 'Flour', 'Dye', 'Pottery', 'Waterskin',
                'Coal', 'Oil', 'Blight Fuel', 'Sea Marrow', 'Simple Tools', 'Wood',
                'Drizzle Water', 'Clearance Water', 'Storm Water',
            ];
            const resourceRank = rankIn(RESOURCE_ORDER);
            const compareResources = (a, b) => resourceRank(a) - resourceRank(b) || a.localeCompare(b);

            // Ingredient Grid order: the wiki's resource groups, simple to complex, so each ingredient comes before what it makes.
            // Goods not listed (e.g. newly added ones) go at the end.
            const GRID_GROUPS = [
                ['Drizzle Water', 'Clearance Water', 'Storm Water'],
                ['Berries', 'Fish', 'Insects', 'Roots', 'Vegetables'],
                ['Algae', 'Copper Ore', 'Grain', 'Plant Fibre', 'Salt', 'Scales', 'Stone'],
                ['Herbs', 'Mushrooms', 'Clay', 'Reeds', 'Resin'],
                ['Eggs', 'Meat', 'Leather'],
                ['Wood', 'Sea Marrow', 'Coal', 'Oil'],
                ['Planks', 'Bricks', 'Fabric'],
                ['Flour', 'Dye', 'Copper Bar', 'Crystalized Dew'],
                ['Pottery', 'Barrels', 'Waterskin'],
                ['Pipe', 'Parts', 'Hearth Parts'],
                ['Simple Tools', 'Blight Fuel'],
                ['Biscuits', 'Jerky', 'Pickled Goods', 'Paste', 'Pie', 'Porridge', 'Skewers'],
                ['Coats', 'Boots'],
                ['Ale', 'Incense', 'Wine', 'Scrolls', 'Tea', 'Training Gear'],
                ['Amber', 'Pack of Building Materials', 'Pack of Crops', 'Pack of Luxury Goods', 'Pack of Provisions', 'Pack of Trade Goods', 'Fishing Bait'],
                ['Ancient Tablet', 'Thunderblight Shard'],
            ];
            const GRID_ORDER = [...GRID_GROUPS.flat().filter(name => name in GOODS), ...Object.keys(GOODS).filter(name => !GRID_GROUPS.flat().includes(name))];
            // Tints shared by the Ingredient Grid and the Recipes widget: one colour per recipe slot, gold for what a good is used in
            const RECIPE_SLOT_TINTS = ['#1e90ff55', '#eb4d4b55', '#f1f2f677'];
            const USED_IN_TINT = '#e1aa4655';

            // --- Building table data, built once and shared ---
            const buildFormattedBuildings = () => {
                const formattedBuildings = [];
                const per_cat = {};
                for (const building in BUILDINGS) {
                    if (BUILDINGS[building]["category"] in per_cat) {
                        per_cat[BUILDINGS[building]["category"]].push(building);
                    } else {
                        per_cat[BUILDINGS[building]["category"]] = [building];
                    }
                    // building products
                    var products = [];
                    for (const rec in BUILDINGS[building]["recipes"]) {
                        var n = BUILDINGS[building]["recipes"][rec]["product"]["name"];
                        if (n in NEEDTRANS) n = NEEDTRANS[n];
                        BUILDINGS[building]["recipes"][rec]["product"]["icon_path"] = GOODS[n]["icon_path"];
                        BUILDINGS[building]["recipes"][rec]["product"]["grade"] = BUILDINGS[building]["recipes"][rec]["grade"];
                        products.push({ ...BUILDINGS[building]["recipes"][rec]["product"], id: n, name: goodDisplayName(n) });
                    }

                    // building costs
                    var cost = [];
                    for (const req in BUILDINGS[building]["requiredGoods"]) {
                        var n = BUILDINGS[building]["requiredGoods"][req]["name"];
                        var reqGood = GOODS[n];
                        cost.push({"amount": BUILDINGS[building]["requiredGoods"][req]["amount"], "icon_path": reqGood["icon_path"], "id": n, "name": reqGood["displayName"]});
                    }

                    formattedBuildings.push({
                        building: BUILDINGS[building].displayName,
                        icon: BUILDINGS[building].icon,
                        products: products,
                        cost: cost,
                        id: building,
                        category: BUILDINGS[building].category,
                        proficiencyTags: BUILDINGS[building].proficiencyTags || [],
                        comfortTags: BUILDINGS[building].comfortTags || [],
                    });
                }
                formattedBuildings.sort(compareWikiOrder);
                // Category filter buttons follow the same order
                const orderedPerCat = {};
                for (const category of Object.keys(per_cat).sort(compareCategory)) {
                    orderedPerCat[category] = per_cat[category];
                }
                return { formattedBuildings, per_cat: orderedPerCat };
            };
            const { formattedBuildings: FORMATTED_BUILDINGS, per_cat: PER_CAT } = buildFormattedBuildings();

            // --- Recipes widget data: every building recipe by the good it makes, best rating first ---
            const plainGoodName = (name) => name.split(']').pop().trim(); // "[Other] Fishing Bait" -> "Fishing Bait"
            const buildRecipeIndex = () => {
                const madeBy = {};
                const baitFor = {};
                const add = (building, recipe) => {
                    if (!(recipe.product.name in GOODS)) return; // services such as Treatment
                    (madeBy[recipe.product.name] = madeBy[recipe.product.name] || []).push({ building, recipe });
                };
                for (const id in BUILDINGS) {
                    const building = BUILDINGS[id];
                    (building.recipes || []).forEach(recipe => add(building, recipe));
                    // Fishing Huts make their own bait, outside their recipe list
                    if (building.bait && building.baitIngredient) {
                        const bait = plainGoodName(building.bait.name);
                        add(building, { product: { name: bait, amount: building.bait.amount }, grade: '',
                            ingredients: [[{ name: plainGoodName(building.baitIngredient.name), amount: building.baitIngredient.amount }]] });
                        (baitFor[bait] = baitFor[bait] || []).push(building);
                    }
                }
                Object.values(madeBy).forEach(list => list.sort((a, b) => gradeStars(b.recipe.grade) - gradeStars(a.recipe.grade)));
                return { madeBy, baitFor };
            };
            const RECIPE_INDEX = buildRecipeIndex();

            // Ingredients
            const IngredientGrid = () => {
				const savedIngredientState = loadSavedState();
				const initialActiveElement = savedIngredientState.activeIngredient in GOODS ? savedIngredientState.activeIngredient : null;
				const [activeElement, setActiveElement] = useState(initialActiveElement);

                // Clicking a good picks it; clicking the picked one clears it
                const handleIconClick = (iconName) => {
					const newActiveElement = activeElement === iconName ? null : iconName;
					setActiveElement(newActiveElement);
					saveState({ activeIngredient: newActiveElement });
					// Tell the Buildings table (it keeps its category filters) and the Recipes widget
					window.dispatchEvent(new CustomEvent('ingredientSelection', { detail: newActiveElement }));
                };

                // The picked good's tints: its recipe slots in the slot colours, the goods it is used in in gold
                const picked = activeElement && GOODS[activeElement];
                const slotOf = {};
                if (picked) picked.ingredient_sets.forEach((set, i) => set.forEach(name => { slotOf[name] = i; }));
                const usedIn = new Set(picked ? picked.reverse_set.flat() : []);
                const tintOf = (iconName) => iconName in slotOf ? RECIPE_SLOT_TINTS[slotOf[iconName]] : usedIn.has(iconName) ? USED_IN_TINT : undefined;
                const isIconLit = (iconName) => !picked || iconName === activeElement || iconName in slotOf || usedIn.has(iconName);

                return (
                    <div className="ats-container icon-grid ingredient-grid">
                    <div className="grid-header ats-infobox-header-title">
                        {"Ingredient Grid"}
                    </div>
                    <div className="icon-grid-wrapper">
                        <div className="icon-row">
                            {GRID_ORDER.map((iconName) => (
                                <div
                                key={iconName}
                                className={`ats-single-ingredient-icon icon${iconName === activeElement ? ' icon-active' : ''}${isIconLit(iconName) ? '' : ' icon-inactive'}`}
                                onClick={() => handleIconClick(iconName)}
                                style={{ background: tintOf(iconName) }}
                                id={iconName}
                                >
                                <img src={GOODS[iconName]['icon_path']} alt={goodDisplayName(iconName)} title={goodDisplayName(iconName)} />
                                </div>
                            ))}
                        </div>
                    </div>
                    </div>
                );
            };

            // Needs
            // The panel is as wide as its longest row, whether that is the species or a need group
            const NEEDS_GRID_COLUMNS = Math.max(Object.keys(SPECIES).length, ...NEED_GROUPS.map(group => group.needs.length));

            const NeedsGrid = () => {
				const savedNeedsState = loadSavedState();
				const savedSpecies = savedNeedsState.species;
				const initialActiveSpecies = Array.isArray(savedSpecies)
					? savedSpecies.filter(name => name in SPECIES).slice(0, MAX_SPECIES)
					: [];
				const [speciesColors, setSpeciesColors] = useState(() => assignSpeciesColors(initialActiveSpecies,
					savedNeedsState.speciesColors && typeof savedNeedsState.speciesColors === 'object' ? savedNeedsState.speciesColors : {}));
				const [highlightedSet, setHighlightedSet] = useState(initialActiveSpecies.length > 0
					? initialActiveSpecies.map(name => [...SPECIES[name], name])
					: null);
				const [activeSpecies, setActiveSpecies] = useState(initialActiveSpecies.length > 0 ? initialActiveSpecies : null);
				window.currentSpeciesSelection = activeSpecies ? [...activeSpecies] : [];

				// Compact shows the needs grid; Extended shows every need each species wants, under its portrait
				const [needsView, setNeedsView] = useState(savedNeedsState.needsView === 'extended' ? 'extended' : 'compact');
				useEffect(() => saveState({ needsView }), [needsView]);
				const nextView = needsView === 'compact' ? 'extended' : 'compact';

				// Tint color order is determined by the grid order of the selected species
				const pickedInGridOrder = activeSpecies ? Object.keys(SPECIES).filter(name => activeSpecies.includes(name)) : [];
				const wants = (species, iconName) => species === iconName || SPECIES[species].includes(iconName);

				const getTintStyle = (iconName) => speciesTintStyle(pickedInGridOrder.filter(species => wants(species, iconName))
					.map(species => SPECIES_COLORS[speciesColors[species]]), iconName in SPECIES);

                const handleIconClick = (iconName) => {
                    if (!(iconName in SPECIES)) {
                        if (iconName in NEEDTRANS) iconName = NEEDTRANS[iconName];
                        document.getElementById(iconName).click()
                        return;
                    }

					var newActiveSpecies = activeSpecies ? [...activeSpecies] : null;
                    if (activeSpecies) {
                        if (activeSpecies.includes(iconName)) {
                            if (activeSpecies.length == 1) {
                                newActiveSpecies = null;
                                setActiveSpecies(newActiveSpecies);
                            } else {
                                newActiveSpecies.splice(newActiveSpecies.indexOf(iconName), 1);
                                setActiveSpecies(newActiveSpecies);
                            }
                        } else {
                            if (activeSpecies.length >= MAX_SPECIES) return;
                            newActiveSpecies.push(iconName);
                            setActiveSpecies(newActiveSpecies);
                        }
                    } else {
                        newActiveSpecies = [iconName];
                        setActiveSpecies(newActiveSpecies);
                    }
                    highlightNeeds(newActiveSpecies);
					const newSpeciesColors = assignSpeciesColors(newActiveSpecies || [], speciesColors);
					setSpeciesColors(newSpeciesColors);

                    // Broadcast for the Best Buildings tab (separate React tree)
                    window.currentSpeciesSelection = newActiveSpecies ? [...newActiveSpecies] : [];
					saveState({ species: window.currentSpeciesSelection, speciesColors: newSpeciesColors });
                    window.dispatchEvent(new CustomEvent('speciesSelection', { detail: window.currentSpeciesSelection }));
                };

                const highlightNeeds = (newActiveSpecies) => {
                    var newHighlightedSet = null;
                    if (newActiveSpecies) {
                        for (const iconName of newActiveSpecies) {
							var names = [...SPECIES[iconName], iconName];
                            if (!newHighlightedSet) {
                                newHighlightedSet = [names];
                            } else {
                                newHighlightedSet.push(names);
                            }
                        }
                    }
                    setHighlightedSet(newHighlightedSet);
                }

                const isIconHighlighted = (iconName) => {
                    if (!highlightedSet || !activeSpecies) return true;
                    return highlightedSet.flat().includes(iconName) || activeSpecies.includes(iconName);
                };

                // Hover preview: pointing at a species dims the needs it doesn't have, and pointing at a
                // need dims the species that don't want it. Mouse only, so a tap on a phone doesn't leave it stuck.
                const [hoveredIcon, setHoveredIcon] = useState(null);
                const hoverHandlers = (iconName) => ({
                    onPointerEnter: (e) => { if (e.pointerType === 'mouse') setHoveredIcon(iconName); },
                    onPointerLeave: () => setHoveredIcon(null),
                });
                const isIconShown = (iconName) => {
                    if (iconName === hoveredIcon) return true;
                    if (hoveredIcon && (hoveredIcon in SPECIES) !== (iconName in SPECIES)) {
                        return iconName in SPECIES ? wants(iconName, hoveredIcon) : wants(hoveredIcon, iconName);
                    }
                    return isIconHighlighted(iconName);
                };

                // One icon, species or need. Species keep an id: the Best Buildings tab clicks them by id.
                const renderIcon = (iconName) => (
                    <div
                    key={iconName}
                    className={`ats-single-ingredient-icon icon${isIconShown(iconName) ? '' : ' icon-inactive'}`}
                    id={iconName in SPECIES ? iconName : undefined}
                    style={getTintStyle(iconName) || undefined}
                    onClick={() => { setHoveredIcon(null); handleIconClick(iconName); }}
                    {...hoverHandlers(iconName)}
                    >
                        <img src={SPECIES_ICONS[iconName]} alt={iconName} title={iconName} />
                    </div>
                );

                // One Extended cell: the need if this species wants it, tinted and faded like the species. No id, so species ids stay unique.
                const renderMatrixCell = (species, need) => {
                    const wanted = SPECIES[species].includes(need);
                    return (
                        <div
                        key={`${need}-${species}`}
                        className={`ats-single-ingredient-icon icon need-matrix-cell${wanted ? '' : ' empty'}${isIconShown(species) ? '' : ' icon-inactive'}`}
                        style={getTintStyle(species) || undefined}
                        onClick={wanted ? () => handleIconClick(need) : undefined}
                        >
                            <img src={SPECIES_ICONS[need]} alt={wanted ? need : ''} title={wanted ? need : undefined} />
                        </div>
                    );
                };

                return (
                    <div className="ats-container icon-grid needs-grid" style={{ '--columns': NEEDS_GRID_COLUMNS }}>
                        <div className="grid-header ats-infobox-header-title">
                            {"Species Needs"}
                            <SacredGroveWarning count={activeSpecies ? activeSpecies.length : 0} />
                            <button type="button" className="view-toggle hover-tip" data-tooltip={nextView === 'extended' ? 'Expand' : 'Collapse'}
                                aria-label={nextView === 'extended' ? 'Expand' : 'Collapse'} onClick={() => setNeedsView(nextView)}>
                                <i key={needsView} className={`fa-solid ${nextView === 'extended' ? 'fa-chevron-down' : 'fa-chevron-up'}`} aria-hidden="true"></i>
                            </button>
                        </div>
                        <div className="icon-grid-wrapper">
                            <div className="icon-row header-row">
                                {Object.keys(SPECIES).map(renderIcon)}
                            </div>

                            {needsView === 'compact' ? NEED_GROUPS.map(group => (
                                <div key={group.name} className='icon-row need-group' role='group' aria-label={group.name}>
                                    {group.needs.map(renderIcon)}
                                </div>
                            )) : NEED_GROUPS.map((group, g) => group.needs.map((need, i) => (
                                <div key={need} className={`icon-row need-matrix-row${g > 0 && i === 0 ? ' group-start' : ''}`}>
                                    {Object.keys(SPECIES).map(species => renderMatrixCell(species, need))}
                                </div>
                            )))}

                        </div>
                    </div>
                );
            };
			
			// Recipes widget pieces. A good is framed with its amount in the corner and its rating under it; clicking it picks it.
			const RecipeGood = ({ name, amount, grade, picked, extraClass = '' }) => (
				<span className={`recipe-good${name === picked ? ' picked' : ''}${extraClass}`}
					title={`${amount ? amount + ' ' : ''}${goodDisplayName(name)}${grade ? ' ' + grade : ''}`} onClick={() => selectInGrid(name)}>
					<img src={GOODS[name].icon_path} alt={goodDisplayName(name)} />
					{amount ? <span className="recipe-amount">{amount}</span> : null}
					{grade ? <GradeBadge grade={grade} /> : null}
				</span>
			);
			// Buildings aren't clickable; the name shows on hover
			const RecipeBuilding = ({ building, grade }) => (
				<span className="recipe-building" title={`${building.displayName}${grade ? ' ' + grade : ''}`}>
					<img src={building.icon} alt={building.displayName} />
					{grade ? <GradeBadge grade={grade} /> : null}
				</span>
			);
			// A recipe's slots, tinted like the grid and joined by "+". `fadeOthers` dims everything but the picked good.
			const RecipeSlots = ({ sets, picked, fadeOthers = false }) => (
				<span className="recipe-rhs">
					{sets.map((set, i) => (
						<React.Fragment key={i}>
							{i > 0 && <span className="recipe-sign">+</span>}
							<span className="recipe-slot" style={{ background: RECIPE_SLOT_TINTS[i] }}>
								{set.map(item => <RecipeGood key={item.name} name={item.name} amount={item.amount} picked={picked}
									extraClass={fadeOthers && item.name !== picked ? ' faded' : ''} />)}
							</span>
						</React.Fragment>
					))}
				</span>
			);
			const uniqueBy = (list, key) => list.filter((item, i) => list.findIndex(other => key(other) === key(item)) === i);
			// A section heading with its buildings on the right, best rating first
			const RecipeSection = ({ title, entries, children }) => (
				<>
					<h3 className="recipe-heading">
						{title}
						<span className="recipe-buildings">
							{uniqueBy(entries, entry => entry.building).map((entry, i) => <RecipeBuilding key={i} building={entry.building} grade={entry.recipe.grade} />)}
						</span>
					</h3>
					<div className="recipe-rows">{children}</div>
				</>
			);
			// How a building without ingredients gets the good
			const isFarmed = ({ recipe }) => !!recipe.plantingTime;
			const isMined = ({ building }) => building.id === 'Mine';
			const isGathered = ({ recipe }) => !!(recipe.seekedResource || recipe.seekedDeposits);
			const GATHER_KINDS = [
				['Gathered by', isGathered],
				['Farmed by', isFarmed],
				['Mined by', isMined],
				['Collected by', entry => !isGathered(entry) && !isFarmed(entry) && !isMined(entry)],
			];
			const gatherTime = (recipe) => recipe.plantingTime ? `${recipe.plantingTime}s + ${recipe.harvestingTime}s`
				: (recipe.gatheringTime || recipe.productionTime) ? `${recipe.gatheringTime || recipe.productionTime}s` : null;

			// Recipes: how the picked good is gathered or made, and what it is used in. Follows the Ingredient Grid's pick.
			const RecipesWidget = () => {
				const [picked, setPicked] = useState(() => {
					const saved = loadSavedState().activeIngredient;
					return saved in GOODS ? saved : null;
				});
				useWindowEvent('ingredientSelection', (e) => setPicked(e.detail in GOODS ? e.detail : null));

				const header = <div className="grid-header ats-infobox-header-title">{"Recipes"}</div>;
				if (!picked) {
					return <div className="ats-container recipes-widget">{header}<p className="recipe-note">Pick a good to see its recipes.</p></div>;
				}

				const all = RECIPE_INDEX.madeBy[picked] || [];
				const crafted = all.filter(entry => entry.recipe.ingredients);
				// Same rating means the same recipe, so each rating (and amount, for gathering) gets one row
				const byRating = (list, withAmount) => uniqueBy(list, entry => entry.recipe.grade + (withAmount ? '|' + entry.recipe.product.amount : ''));
				const usedIn = [...new Set(GOODS[picked].reverse_set.flat())].filter(name => name in GOODS)
					.sort((a, b) => GRID_ORDER.indexOf(a) - GRID_ORDER.indexOf(b));
				const huts = RECIPE_INDEX.baitFor[picked];

				return (
					<div className="ats-container recipes-widget">
						{header}
						<div className="recipe-title">
							<img src={GOODS[picked].icon_path} alt="" />
							{goodDisplayName(picked)}
						</div>
						{all.length === 0 && <p className="recipe-note">No building makes it.</p>}

						{GATHER_KINDS.map(([title, test]) => {
							const entries = all.filter(entry => !entry.recipe.ingredients && test(entry));
							if (!entries.length) return null;
							return (
								<RecipeSection key={title} title={title} entries={entries}>
									<div className="recipe-row">
										{byRating(entries, true).map(({ recipe }, i) => (
											<span key={i} className="recipe-yield">
												<RecipeGood name={picked} amount={recipe.product.amount} grade={recipe.grade} picked={picked} />
												{gatherTime(recipe) && <span className="recipe-time">{gatherTime(recipe)}</span>}
											</span>
										))}
									</div>
								</RecipeSection>
							);
						})}

						{crafted.length > 0 &&
							<RecipeSection title="Made by" entries={crafted}>
								{byRating(crafted, false).map(({ recipe }, i) => (
									<div key={i} className="recipe-row recipe-equation">
										<RecipeGood name={picked} amount={recipe.product.amount} grade={recipe.grade} picked={picked} />
										<span className="recipe-sign">=</span>
										<RecipeSlots sets={recipe.ingredients} picked={picked} />
										{recipe.productionTime && <span className="recipe-time recipe-time-end">{recipe.productionTime}s</span>}
									</div>
								))}
							</RecipeSection>
						}

						<h3 className="recipe-heading">Used in</h3>
						<div className="recipe-rows recipe-uses">
							{/* Bait isn't an ingredient: Fishing Huts use it to double their catch */}
							{huts &&
								<div className="recipe-row">
									{huts.map((building, i) => <RecipeBuilding key={i} building={building} />)}
									<span className="recipe-note">
										doubles the catch of {uniqueBy(huts.flatMap(building => (building.recipes || []).map(recipe => recipe.product.name)), name => name)
											.filter(name => name in GOODS).map(goodDisplayName).join(', ').replace(/, ([^,]*)$/, ' and $1')}
									</span>
								</div>
							}
							{usedIn.map(product => (
								<div key={product} className="recipe-row recipe-equation">
									<RecipeGood name={product} picked={picked} extraClass=" used-in" />
									<span className="recipe-sign">=</span>
									<RecipeSlots sets={GOODS[product].ingredient_sets.map(set => set.map(name => ({ name })))} picked={picked} fadeOthers />
								</div>
							))}
							{!huts && usedIn.length === 0 && <p className="recipe-note">Nothing. It is an end product.</p>}
						</div>
					</div>
				);
			};

			// Buildings data table
			const DataTable = () => {
				const per_cat = PER_CAT;
				const [savedTableState] = useState(loadSavedState); // read once, for the initial values
				const categoryNames = Object.keys(per_cat);
				const renamedCats = {'Resource Gathering': 'Resource Acquisition', 'Extraction Building': 'Resource Acquisition'}; // older saved names
				const savedCats = Array.isArray(savedTableState.activeCategories)
					? [...new Set(savedTableState.activeCategories.map(category => renamedCats[category] || category))].filter(category => categoryNames.includes(category))
					: [];
				const initialActiveCats = savedCats.length ? savedCats : categoryNames; // none saved means all
				const initialActiveFilts = Array.isArray(savedTableState.buildingFilters)
					? savedTableState.buildingFilters.filter(filter => ['Products', 'Costs'].includes(filter))
					: ['Products'];
				const data = FORMATTED_BUILDINGS;
				const [searchTerm, setSearchTerm] = useState(typeof savedTableState.buildingSearch === 'string' ? savedTableState.buildingSearch : '');
				// Sorting: grouped by category (the default), or by building name. Older saved
				// 'products' / 'cost' sorts fall back to the default.
				const [sortKey, setSortKey] = useState(['category', 'building'].includes(savedTableState.sortKey) ? savedTableState.sortKey : 'category');
				const [sortDirection, setSortDirection] = useState(['asc', 'desc'].includes(savedTableState.sortDirection) ? savedTableState.sortDirection : 'asc');
				const [activeCats, setActiveCats] = useState(initialActiveCats);
				const [activeFilts, setActiveFilts] = useState(initialActiveFilts);

				useEffect(() => saveState({ buildingSearch: searchTerm }), [searchTerm]);
				useEffect(() => saveState({ sortKey, sortDirection }), [sortKey, sortDirection]);
				useEffect(() => saveState({ activeCategories: activeCats }), [activeCats]);
				useEffect(() => saveState({ buildingFilters: activeFilts }), [activeFilts]);

				const handleSearch = (event) => {
					setSearchTerm(event.target.value);
				};

				const handleSort = (key) => {
					if (sortKey === key) {
						if (sortDirection === 'asc') {
							setSortDirection('desc');
						} else {
							// Reset to the default category grouping
							setSortKey('category');
							setSortDirection('asc');
						}
					} else {
						setSortKey(key);
						setSortDirection('asc');
					}
				};
				
				const sortedData = [...data].sort((a, b) => {
					if (sortKey === 'category') return compareWikiOrder(a, b);
					const byName = a.building.localeCompare(b.building);
					return sortDirection === 'desc' ? -byName : byName;
				});

				const isGrouped = sortKey === 'category';

				const handleFilter = (filterCat) => {
					if (filterCat === "Costs" || filterCat === "Products") {
						// Toggle one column. With both off, the ingredient filters nothing and a search matches names only.
						setActiveFilts(prevActiveFilts => prevActiveFilts.includes(filterCat)
							? prevActiveFilts.filter(filter => filter !== filterCat)
							: [...prevActiveFilts, filterCat]);
						return;
					}
				
					if (filterCat === "all") {
						setActiveCats(categoryNames);
					} else {
						setActiveCats(prevActiveCats => {
							const newActiveCats = [...prevActiveCats]; // Create a copy
							if (prevActiveCats.length == categoryNames.length) {
								return [filterCat];
							}
							
							const idx = newActiveCats.indexOf(filterCat);
							if (idx === -1) {
								newActiveCats.push(filterCat);
							} else {
								newActiveCats.splice(idx, 1);
							}
							// Turning off the last category shows everything again, like "All"
							return newActiveCats.length ? newActiveCats : categoryNames;
						});
					}
				};

				const allCatsActive = activeCats.length == categoryNames.length;
				// The ingredient picked in the Ingredient Grid (null when none), kept in sync by its event
				const [activeIngredient, setActiveIngredient] = useState(savedTableState.activeIngredient in GOODS ? savedTableState.activeIngredient : null);
				useWindowEvent('ingredientSelection', (e) => setActiveIngredient(e.detail || null));
				
				const filteredData = sortedData.filter(item => {
					if (activeCats.indexOf(item.category) == -1) {
						return false;
					}

					// Match against the item names in the columns that are switched on
					const goods = [
						...(activeFilts.includes('Products') ? item.products : []),
						...(activeFilts.includes('Costs') ? item.cost : []),
					];
					if (activeIngredient) {
						if (activeFilts.length === 0) return true; // both columns off: the ingredient filters nothing
						return goods.some(good => good.id === activeIngredient); // whole name, so Fish doesn't match Fishing Bait
					}
					// A search matches the in-game name or the key
					const term = searchTerm.toLowerCase();
					return [item.building, ...goods.flatMap(good => [good.name, good.id])]
						.some(name => name.toLowerCase().includes(term));
				});

				// Products / Building Cost headers become match toggles while a search or ingredient is
				// active: they choose which columns the search or ingredient is matched against.
				const matching = activeIngredient !== null || searchTerm !== '';
				const activeName = activeIngredient && goodDisplayName(activeIngredient);
				const matchTarget = activeName || `"${searchTerm}"`;
				const columnHeader = (filter, label, verb) => {
					if (!matching) return label;
					const on = activeFilts.includes(filter);
					return (
						<button type="button" className={`column-filter ${on ? 'cat-active' : 'cat-inactive'}`} aria-pressed={on}
							title={`${on ? 'Including' : 'Not including'} buildings that ${verb} ${matchTarget}. Click to ${on ? 'exclude' : 'include'} them.`}
							onClick={() => handleFilter(filter)}>
							{label}
						</button>
					);
				};

				return (
					<div className="ats-container icon-grid buildings-panel">
						<div className="grid-header ats-infobox-header-title">
							{"Buildings"}
						</div>
						<div className="icon-grid-wrapper">
							{/* While an ingredient is picked, it replaces the search box: icon, name, and a button to clear it */}
							{activeIngredient ?
							<div className="filter-chip-row">
								<span className="ingredient-chip">
									<img src={GOODS[activeIngredient].icon_path} alt="" />
									<span className="ingredient-chip-name">{activeName}</span>
									<button type="button" className="ingredient-chip-clear" onClick={() => selectInGrid(activeIngredient)}
										title={`Stop filtering by ${activeName}`} aria-label={`Stop filtering by ${activeName}`}>✕</button>
								</span>
							</div>
							:
							<div className="filter-chip-row"><input type="text" placeholder="Search" id="SearchInput" value={searchTerm} onChange={handleSearch} /></div>
							}
							<div className="button-row">
							<button onClick={() => handleFilter("all")} className={allCatsActive ? "cat-active" : "cat-inactive"}>All</button>
							<span className="button-divider" aria-hidden="true"></span>
							{/* With everything shown, only "All" is highlighted: clicking a category then shows just that one */}
							{Object.keys(per_cat).map((catItem, catIndex) => (
								<button key={catItem} onClick={() => handleFilter(catItem)} className={(allCatsActive || activeCats.indexOf(catItem) == -1) ? "cat-inactive" : "cat-active"}>{categoryButtonLabel(catItem)}</button>
							))}
							</div>
							<table className="data-table buildings-table">
								<thead>
									<tr>
										<th aria-sort={isGrouped ? 'none' : sortDirection === 'asc' ? 'ascending' : 'descending'}>
											<button type="button" className="sort-button" onClick={() => handleSort('building')}
												title={isGrouped ? 'Sort by name, A to Z' : sortDirection === 'asc' ? 'Sort by name, Z to A' : 'Back to grouped by category'}>
												Building
												<span className="sort-indicator" aria-hidden="true">{isGrouped ? ' ⇅' : sortDirection === 'asc' ? ' ▲' : ' ▼'}</span>
											</button>
										</th>
										<th>{columnHeader('Products', 'Products', 'make')}</th>
										<th>{columnHeader('Costs', <><span className="cost-header-building">Building </span>Cost</>, 'are built with')}</th>
									</tr>
								</thead>
								<tbody>
									{filteredData.length === 0 &&
										<tr className="empty-row">
											<td colSpan="3">
												{allCatsActive ? 'No buildings match.' : 'No buildings match in the selected categories. Click "All" to see every category.'}
											</td>
										</tr>
									}
									{filteredData.map((item, index) => (
										<React.Fragment key={item.id}>
										{isGrouped && (index === 0 || filteredData[index - 1].category !== item.category) &&
											<tr className="category-row">
												<td colSpan="3"><span>{item.category}</span></td>
											</tr>
										}
										<tr>
											<td>
												<div className="building-cell">
													<img className="building-icon" src={item.icon} alt={item.building} />
													<span className="building-name">{item.building}</span>
												</div>
											</td>
											<td>
												{item.products.map((productItem, productIndex) => (
												  <ProductLine key={productIndex} product={productItem} />
												))}
											</td>
											<td>
												{item.cost.map((costItem, costIndex) => (
												  <CostLine key={costIndex} cost={costItem} />
												))}
											</td>
										</tr>
										</React.Fragment>
									))}
								</tbody>
							</table>
						</div>
					</div>
				);
			};

			// Drag and drop
			// The upper half's widgets sit in two columns; each column is its own drop area
			const DEFAULT_WIDGET_COLUMNS = [['ingredients'], ['needs', 'recipes']];
			const WIDGET_IDS = DEFAULT_WIDGET_COLUMNS.flat();
			// Saved columns, cleaned: unknown or repeated ids go, and a missing widget goes under the one before it in the
			// default order. An older saved widgetOrder (one row of two) becomes one widget per column.
			const savedWidgetColumns = () => {
				const saved = loadSavedState();
				let columns = DEFAULT_WIDGET_COLUMNS;
				if (Array.isArray(saved.widgetColumns) && saved.widgetColumns.length === 2 && saved.widgetColumns.every(Array.isArray)) {
					columns = saved.widgetColumns;
				} else if (Array.isArray(saved.widgetOrder)) {
					const order = saved.widgetOrder.filter((id, i) => WIDGET_IDS.includes(id) && saved.widgetOrder.indexOf(id) === i);
					if (order.length === 2) columns = [[order[0]], [order[1]]];
				}
				const seen = new Set();
				const cleaned = columns.map(column => column.filter(id => WIDGET_IDS.includes(id) && !seen.has(id) && seen.add(id)));
				if (seen.size === 0) return DEFAULT_WIDGET_COLUMNS.map(column => [...column]);
				WIDGET_IDS.forEach((id, i) => {
					if (seen.has(id)) return;
					const before = WIDGET_IDS[i - 1];
					const column = cleaned.find(ids => ids.includes(before)) || cleaned[DEFAULT_WIDGET_COLUMNS.findIndex(ids => ids.includes(id))];
					column.splice(column.includes(before) ? column.indexOf(before) + 1 : column.length, 0, id);
					seen.add(id);
				});
				return cleaned;
			};

			const DraggableContainer = () => {
				const widgets = { ingredients: <IngredientGrid />, needs: <NeedsGrid />, recipes: <RecipesWidget /> };
				const [columns, setColumns] = useState(savedWidgetColumns);
				const [dragging, setDragging] = useState(false);

				const onDragEnd = (result) => {
					setDragging(false);
					if (!result.destination) return; // If dropped outside the columns, do nothing
					const from = Number(result.source.droppableId.split('-')[1]);
					const to = Number(result.destination.droppableId.split('-')[1]);
					const newColumns = columns.map(column => [...column]);
					const [moved] = newColumns[from].splice(result.source.index, 1);
					newColumns[to].splice(result.destination.index, 0, moved);
					setColumns(newColumns);
					saveState({ widgetColumns: newColumns });
				};

				return (
					// Applied before the columns are measured, so an empty one has its drop area by then
					<DragDropContext onBeforeCapture={() => ReactDOM.flushSync(() => setDragging(true))} onDragEnd={onDragEnd}>
						<div className={`widget-columns${dragging ? ' dragging' : ''}`}>
							{columns.map((column, c) => (
								<Droppable key={c} droppableId={`column-${c}`}>
									{(provided) => (
										<div className={`widget-column${column.length ? '' : ' empty'}`} ref={provided.innerRef} {...provided.droppableProps}>
											{column.map((id, index) => (
												<Draggable key={id} draggableId={id} index={index}>
													{(provided) => (
														<div
															ref={provided.innerRef}
															{...provided.draggableProps}
															{...provided.dragHandleProps}
															className="container-block-item"
															style={{ ...provided.draggableProps.style, cursor: "grab" }}
														>
															{widgets[id]}
														</div>
													)}
												</Draggable>
											))}
											{provided.placeholder}
										</div>
									)}
								</Droppable>
							))}
						</div>
					</DragDropContext>
				);
			};
			
			ReactDOM.render(<DraggableContainer />, document.querySelector("#block_1"));
			
			// Raw resources: from wiki "Raw Food" + "Raw Crafting Materials" + Wood + Water + Sea Marrow.
			// https://wiki.hoodedhorse.com/Against_the_Storm/Resources
			const RAW_RESOURCES = [
				'Berries', 'Eggs', 'Fish', 'Insects', 'Meat', 'Mushrooms', 'Roots', 'Vegetables',
				'Algae', 'Clay', 'Copper Ore', 'Grain', 'Herbs', 'Leather',
				'Plant Fibre', 'Reeds', 'Resin', 'Salt', 'Scales', 'Stone', 'Wood',
				'Sea Marrow',
				'Drizzle Water', 'Clearance Water', 'Storm Water'
			].sort(compareResources);

			const INGREDIENT_GROUP_COLORS = ['#1e90ff66', '#eb4d4b66', '#f1f2f699'];
			// Lighter tints for chips inside a branch, so a sub-recipe reads as part of its top-level slot
			const INGREDIENT_GROUP_COLORS_NESTED = ['#1e90ff2e', '#eb4d4b2e', '#f1f2f633'];

			const isRawResource = (name) => RAW_RESOURCES.includes(name);

			// Checkbox lists follow the wiki's resource and building order
			const NEEDED_GOODS = [...new Set(NEEDS.map(n => NEEDTRANS[n] || n))].filter(g => GOODS[g]).sort(compareResources);
			const TRANSITIONAL_GOODS = Object.keys(GOODS)
				.filter(g => !isRawResource(g) && GOODS[g].ingredient_sets && GOODS[g].ingredient_sets.length > 0 && !NEEDED_GOODS.includes(g))
				.sort(compareResources);
			// Every ingredient a needed good's tree can reach, at any depth (Ale -> Barrels -> Planks)
			const ingredientsUsedByNeededGoods = new Set();
			const addIngredientsOf = (goodName) => {
				const good = GOODS[goodName];
				if (!good || !good.ingredient_sets) return;
				good.ingredient_sets.forEach(group => group.forEach(ing => {
					if (ingredientsUsedByNeededGoods.has(ing)) return;
					ingredientsUsedByNeededGoods.add(ing);
					addIngredientsOf(ing);
				}));
			};
			NEEDED_GOODS.forEach(addIngredientsOf);
			// Only goods the tree can use get a recipe-building checkbox; the rest (Bricks, Tools, ...)
			// can't change the table
			const TRANSITIONAL_FOR_NEEDED = TRANSITIONAL_GOODS.filter(g => ingredientsUsedByNeededGoods.has(g));
			const CITY_BUILDINGS = Object.entries(BUILDINGS)
				.filter(([, b]) => b.category === 'City Buildings')
				.map(([id]) => id)
				.sort(compareBuildingIds);
			const NEED_TO_SERVICE_BUILDINGS = {};
			CITY_BUILDINGS.forEach(bid => {
				const b = BUILDINGS[bid];
				if (b.recipes) {
					b.recipes.forEach(r => {
						const need = (r.servedNeed || r.product?.name || '').trim();
						if (need) {
							const norm = need === 'Leasiure' ? 'Leisure' : need;
							if (!(norm in NEED_TO_SERVICE_BUILDINGS)) NEED_TO_SERVICE_BUILDINGS[norm] = [];
							if (!NEED_TO_SERVICE_BUILDINGS[norm].includes(bid)) NEED_TO_SERVICE_BUILDINGS[norm].push(bid);
						}
					});
				}
			});
			// Upgraded versions ("Holy Market" of "Market") serve the same needs as the base building,
			// so they are dropped in favour of the base
			const servedNeedsKey = (bid) => Object.keys(NEEDTRANS)
				.filter(need => (NEED_TO_SERVICE_BUILDINGS[need] || []).includes(bid)).join('|');
			const UPGRADED_BUILDINGS = CITY_BUILDINGS.filter(bid => CITY_BUILDINGS.some(baseId => bid !== baseId
				&& BUILDINGS[bid].displayName.endsWith(' ' + BUILDINGS[baseId].displayName)
				&& servedNeedsKey(bid) === servedNeedsKey(baseId)));
			Object.keys(NEED_TO_SERVICE_BUILDINGS).forEach(need => {
				NEED_TO_SERVICE_BUILDINGS[need] = NEED_TO_SERVICE_BUILDINGS[need].filter(bid => !UPGRADED_BUILDINGS.includes(bid));
			});
			// Only city buildings that serve one of the service needs in the table get a checkbox
			const SERVICE_BUILDINGS = CITY_BUILDINGS.filter(bid => servedNeedsKey(bid) !== '');

			const isIngredientAvailable = (ingredient, rawSet, visited = new Set()) => {
				if (visited.has(ingredient)) return false;
				if (!GOODS[ingredient]) return false;
				if (isRawResource(ingredient)) return rawSet.has(ingredient);
				const sets = GOODS[ingredient].ingredient_sets;
				if (!sets || sets.length === 0) return false;
				visited.add(ingredient);
				const available = sets.every(group =>
					group.some(ing => isIngredientAvailable(ing, rawSet, visited))
				);
				visited.delete(ingredient);
				return available;
			};

			const getFirstAvailableInGroup = (group, rawSet) =>
				group.find(ing => isIngredientAvailable(ing, rawSet));

			const getMinRawsToAddForIngredient = (ingredient, rawSet, visited = new Set()) => {
				if (visited.has(ingredient)) return Infinity;
				if (!GOODS[ingredient]) return Infinity;
				if (isRawResource(ingredient)) return rawSet.has(ingredient) ? 0 : 1;
				const sets = GOODS[ingredient].ingredient_sets;
				if (!sets || sets.length === 0) return Infinity;
				visited.add(ingredient);
				let total = 0;
				for (const group of sets) {
					const minCost = Math.min(...group.map(ing => getMinRawsToAddForIngredient(ing, rawSet, visited)));
					total += minCost;
				}
				visited.delete(ingredient);
				return total;
			};

			const getMinRawsToAdd = (goodName, currentRawResources) => {
				const rawSet = new Set(currentRawResources);
				const good = GOODS[goodName];
				if (!good || !good.ingredient_sets) return 0;
				let total = 0;
				for (const group of good.ingredient_sets) {
					const minCost = Math.min(...group.map(ing => getMinRawsToAddForIngredient(ing, rawSet)));
					total += minCost;
				}
				return total;
			};

			// A service need (Leisure, Brawling, ...) with none of the buildings that provide it ticked
			const isServiceBuildingMissing = (need, hasServiceBuilding) => {
				const providers = need in NEEDTRANS ? NEED_TO_SERVICE_BUILDINGS[need] : null;
				return !!providers && !providers.some(bid => hasServiceBuilding.includes(bid));
			};

			const getLookOutFor = (goodName, currentRawResources, hasRecipeBuilding = [], need = null, hasServiceBuilding = []) => {
				const rawSet = new Set(currentRawResources);
				const good = GOODS[goodName];
				if (!good || !good.ingredient_sets) return [];
				// What still has to be found: service buildings, blueprints for the goods the tree makes
				// (each also marked with a hammer in the tree), then the options for each uncovered slot
				const suggestions = [];
				if (need && isServiceBuildingMissing(need, hasServiceBuilding)) {
					suggestions.push({ type: 'service_building', need });
				}
				// Blueprints: one neutral line for those needed whatever you pick, then one line per
				// coloured slot for those its chosen option needs
				const blueprints = getBlueprintGroups(goodName, rawSet, hasRecipeBuilding);
				if (blueprints.required.length > 0) {
					suggestions.push({ type: 'blueprint', goods: blueprints.required, color: null });
				}
				blueprints.bySlot.forEach((goods, i) => {
					if (goods && goods.length > 0) {
						suggestions.push({ type: 'blueprint', goods, color: INGREDIENT_GROUP_COLORS[i] || INGREDIENT_GROUP_COLORS[0] });
					}
				});
				// A slot that can't be covered lists all its options (a trader can sell any of them). A slot whose
				// only option is made (Flour) lists that good's own uncovered slots instead, in the paler tint.
				const addSlotLines = (group, color, nestedColor, seen) => {
					if (getFirstAvailableInGroup(group, rawSet)) return;
					const only = group.length === 1 ? group[0] : null;
					if (only && !isRawResource(only) && GOODS[only] && GOODS[only].ingredient_sets && !seen.has(only)) {
						seen.add(only);
						GOODS[only].ingredient_sets.forEach(sub => addSlotLines(sub, nestedColor, nestedColor, seen));
						return;
					}
					suggestions.push({ type: 'slot', options: group, color });
				};
				good.ingredient_sets.forEach((group, i) => addSlotLines(group,
					INGREDIENT_GROUP_COLORS[i] || INGREDIENT_GROUP_COLORS[0],
					INGREDIENT_GROUP_COLORS_NESTED[i] || INGREDIENT_GROUP_COLORS_NESTED[0],
					new Set([goodName])));
				return suggestions;
			};

			const getSortedNeeds = (activeSpecies, currentRawResources, hasRecipeBuilding = [], hasServiceBuilding = []) => {
				const isNeedRowDimmed = (need) => {
					if (!activeSpecies) return false;
					const needSpecies = overlappingNeeds[need] || [];
					return needSpecies.length > 0 && needSpecies.every(s => !activeSpecies.includes(s));
				};
				const getLookOutForCount = (need) => {
					return getLookOutFor(NEEDTRANS[need] || need, currentRawResources, hasRecipeBuilding, need, hasServiceBuilding).length;
				};
				return [...NEEDS].sort((a, b) => {
					const dimmedA = isNeedRowDimmed(a) ? 1 : 0;
					const dimmedB = isNeedRowDimmed(b) ? 1 : 0;
					if (dimmedA !== dimmedB) return dimmedA - dimmedB;
					const rawsA = getMinRawsToAdd(NEEDTRANS[a] || a, currentRawResources);
					const rawsB = getMinRawsToAdd(NEEDTRANS[b] || b, currentRawResources);
					if (rawsA !== rawsB) {
						if (rawsA === Infinity) return 1;
						if (rawsB === Infinity) return -1;
						return rawsA - rawsB;
					}
					const lookOutA = getLookOutForCount(a);
					const lookOutB = getLookOutForCount(b);
					if (lookOutA !== lookOutB) return lookOutA - lookOutB;
					const speciesA = (overlappingNeeds[a] || []).length;
					const speciesB = (overlappingNeeds[b] || []).length;
					if (speciesA !== speciesB) return speciesB - speciesA;
					// Final tie-break: the wiki order from NEED_GROUPS, so ties don't depend on sort stability
					return NEEDS.indexOf(a) - NEEDS.indexOf(b);
				});
			};

			// The option the tree uses for a slot: a ticked raw resource first, else the one needing the fewest
			// missing recipe buildings. Null when nothing in the slot can be made.
			const pickSlotIngredient = (group, rawSet, hasRecipeBuilding, visited = new Set()) => {
				const options = group.filter(ing => !visited.has(ing) && isIngredientAvailable(ing, rawSet));
				const raw = options.find(ing => isRawResource(ing));
				if (raw) return raw;
				let best = null;
				let bestMissing = Infinity;
				options.forEach(ing => {
					const missing = countMissingBuildings(ing, rawSet, hasRecipeBuilding, visited);
					if (missing < bestMissing) { best = ing; bestMissing = missing; }
				});
				return best;
			};

			// The ingredient shown for a slot: the picked option, or the only option even when it
			// can't be made yet (Flour for Pie). Null leaves the slot empty.
			const getShownIngredient = (group, rawSet, hasRecipeBuilding, visited) =>
				pickSlotIngredient(group, rawSet, hasRecipeBuilding, visited) || (group.length === 1 ? group[0] : null);

			// Goods the tree makes for a good (the good itself and every made ingredient below it)
			// that no ticked "Have Recipe Building" can make, so each needs a blueprint. No repeats.
			const getBlueprintGoods = (goodName, rawSet, hasRecipeBuilding, visited = new Set()) => {
				const good = GOODS[goodName];
				if (!good || isRawResource(goodName) || visited.has(goodName)) return [];
				if (!good.ingredient_sets || good.ingredient_sets.length === 0) return [];
				const branchVisited = new Set(visited).add(goodName);
				const found = hasRecipeBuilding.includes(goodName) ? [] : [goodName];
				good.ingredient_sets.forEach(group => {
					const shown = getShownIngredient(group, rawSet, hasRecipeBuilding, branchVisited);
					if (shown) found.push(...getBlueprintGoods(shown, rawSet, hasRecipeBuilding, branchVisited));
				});
				return [...new Set(found)];
			};
			const countMissingBuildings = (goodName, rawSet, hasRecipeBuilding, visited = new Set()) =>
				getBlueprintGoods(goodName, rawSet, hasRecipeBuilding, visited).length;

			// getBlueprintGoods split by why each is needed: "required" whatever you pick, "bySlot[i]" for the
			// option chosen in top-level slot i
			const getBlueprintGroups = (goodName, rawSet, hasRecipeBuilding) => {
				const required = [];
				const bySlot = [];
				const seen = new Set();
				const walk = (name, topSlot, forced, visited) => {
					const good = GOODS[name];
					if (!good || isRawResource(name) || visited.has(name)) return;
					if (!good.ingredient_sets || good.ingredient_sets.length === 0) return;
					if (!hasRecipeBuilding.includes(name) && !seen.has(name)) {
						seen.add(name);
						if (forced) required.push(name);
						else (bySlot[topSlot] = bySlot[topSlot] || []).push(name);
					}
					const branchVisited = new Set(visited).add(name);
					good.ingredient_sets.forEach((group, i) => {
						const shown = getShownIngredient(group, rawSet, hasRecipeBuilding, branchVisited);
						if (shown) walk(shown, topSlot === null ? i : topSlot, forced && group.length === 1, branchVisited);
					});
				};
				walk(goodName, null, true, new Set());
				return { required, bySlot };
			};

			// The card's badge: a hammer when the good's own recipe building isn't ticked, a check when
			// everything down the tree (and a service building, if needed) is ticked, otherwise none
			const getCardStatus = (need, currentRawResources, hasRecipeBuilding, hasServiceBuilding) => {
				const goodName = NEEDTRANS[need] || need;
				const good = GOODS[goodName];
				if (!good || !good.ingredient_sets || good.ingredient_sets.length === 0) return {};
				if (!hasRecipeBuilding.includes(goodName)) return { status: 'blueprint', goods: [goodName] };
				if (isServiceBuildingMissing(need, hasServiceBuilding)) return {};
				const rawSet = new Set(currentRawResources);
				const visited = new Set([goodName]);
				const picks = good.ingredient_sets.map(group => pickSlotIngredient(group, rawSet, hasRecipeBuilding, visited));
				return picks.every(Boolean) && countMissingBuildings(goodName, rawSet, hasRecipeBuilding) === 0
					? { status: 'done', goods: picks, counted: false } : {};
			};

			// A ticked raw resource, or a good your ticked raw resources can make with no recipe
			// building missing anywhere in its chain
			const isFullySatisfied = (ing, rawSet, hasRecipeBuilding, visited = new Set()) => {
				if (visited.has(ing) || !isIngredientAvailable(ing, rawSet)) return false;
				return isRawResource(ing) || getBlueprintGoods(ing, rawSet, hasRecipeBuilding, visited).length === 0;
			};

			// A small corner badge: `tip` shows on hover or focus, `label` is read aloud. Clicks and keys
			// stop here, so they don't reach the chip or icon under it.
			const Badge = ({ className, label, tip, children }) => (
				<span
					className={`chip-badge ${className}`}
					role="img"
					tabIndex={0}
					aria-label={label}
					onClick={(e) => e.stopPropagation()}
					onKeyDown={(e) => {
						e.stopPropagation();
						if (e.key === ' ' || e.key === 'Enter') e.preventDefault();
					}}
				>
					<span className="chip-badge-tip" aria-hidden="true">{tip}</span>
					{children}
				</span>
			);

			// A check ("done": fully satisfied) or a hammer ("blueprint": `goods` need a blueprint), naming the
			// goods in its tooltip, with a count when there are several
			const StatusBadge = ({ status, goods, counted = true }) => {
				if (!status) return null;
				const shownGoods = goods.filter(g => GOODS[g]);
				const label = status === 'done' ? 'Satisfied by' : 'Required blueprints:';
				const count = counted ? shownGoods.length : 0;
				return (
					<Badge
						className={status === 'done' ? 'chip-badge-done' : 'chip-badge-blueprint'}
						label={`${label} ${shownGoods.map(g => GOODS[g].displayName).join(', ')}`}
						tip={<>
							<span>{label}</span>
							{shownGoods.map(g => <img key={g} src={GOODS[g].icon_path} alt="" />)}
						</>}
					>
						{/* Keyed by state, so a change of state gets a fresh icon from Font Awesome */}
						<i key={status} className={`fa-solid ${status === 'done' ? 'fa-check' : 'fa-hammer'}`} aria-hidden="true"></i>
						{count > 1 && <span className="chip-badge-count">{count}</span>}
					</Badge>
				);
			};

			// The slots of a made good that the ticked raw resources can't cover (what it still needs)
			const getMissingSlots = (goodName, currentRawResources) => {
				const good = GOODS[goodName];
				if (!good || isRawResource(goodName) || !good.ingredient_sets) return [];
				const rawSet = new Set(currentRawResources);
				return good.ingredient_sets.filter(group => !getFirstAvailableInGroup(group, rawSet));
			};

			// "Still needs ingredients": a ring with three hollow nodes, like the game's recipe picker.
			// The nodes are filled with the badge's background so the ring stops at their edges.
			const RingGlyph = () => (
				<svg className="look-out-ring" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true">
					<circle cx="8" cy="8.8" r="5.2" fill="none" stroke="currentColor" strokeWidth="1.4" />
					<g fill="#081007" stroke="currentColor" strokeWidth="1.4">
						<circle cx="8" cy="3.6" r="2.7" />
						<circle cx="3.5" cy="11.4" r="2.7" />
						<circle cx="12.5" cy="11.4" r="2.7" />
					</g>
				</svg>
			);

			// A goods icon on a Look out for line, with a corner pill when it's made and not ready: a hammer
			// (needs a blueprint) and/or a ring (`needs`: its uncovered slots)
			const LookOutIcon = ({ good, hammer = false, needs = [], onClick }) => {
				const tipGoods = (list) => list.filter(g => GOODS[g]);
				const names = (list) => tipGoods(list).map(g => GOODS[g].displayName).join(', ');
				const label = [
					hammer ? `Required blueprints: ${GOODS[good].displayName}.` : '',
					needs.length > 0 ? needs.map((slot, k) => `${k === 0 ? 'Still needs one of' : 'and one of'} ${names(slot)}`).join(', ') + '.' : '',
				].filter(Boolean).join(' ');
				return (
					<span className="look-out-icon">
						<img src={GOODS[good].icon_path} alt={GOODS[good].displayName} title={GOODS[good].displayName}
							width="24" height="24" onClick={onClick} />
						{(hammer || needs.length > 0) && (
							<Badge
								className="look-out-badge"
								label={label}
								tip={<>
									{hammer && (
										<span className="look-out-tip-row"><span>Required blueprints:</span><img src={GOODS[good].icon_path} alt="" /></span>
									)}
									{needs.map((slot, k) => (
										<span key={k} className="look-out-tip-row">
											<span>{k === 0 ? 'Still needs one of' : 'and one of'}</span>
											{tipGoods(slot).map(g => <img key={g} src={GOODS[g].icon_path} alt="" />)}
										</span>
									))}
								</>}
							>
								{hammer && <i className="fa-solid fa-hammer" aria-hidden="true"></i>}
								{needs.length > 0 && <RingGlyph />}
							</Badge>
						)}
					</span>
				);
			};

			// A slot's options, each marked when it is made and not ready
			const OptionIcons = ({ options, currentRawResources, hasRecipeBuilding }) => options.filter(ing => GOODS[ing]).map(ing => (
				<LookOutIcon key={ing} good={ing} onClick={() => selectInGrid(ing)}
					hammer={!isRawResource(ing) && !hasRecipeBuilding.includes(ing)}
					needs={getMissingSlots(ing, currentRawResources)} />
			));

			// The buildings that provide a service need
			const ServiceBuildingIcons = ({ need }) => (NEED_TO_SERVICE_BUILDINGS[need] || []).filter(bid => BUILDINGS[bid]).map(bid => (
				<img key={bid} className="service-building-icon" src={BUILDINGS[bid].icon}
					alt={BUILDINGS[bid].displayName} title={BUILDINGS[bid].displayName} width="24" height="24" />
			));

			// The badge for a slot covered by `satisfier`: a check listing every option in the slot that is
			// fully satisfied, or a hammer listing the blueprints its chain still needs
			const slotBadge = (group, satisfier, rawSet, hasRecipeBuilding, visited) => {
				const chain = isRawResource(satisfier) ? [] : getBlueprintGoods(satisfier, rawSet, hasRecipeBuilding, visited);
				return chain.length === 0
					? { status: 'done', goods: group.filter(ing => isFullySatisfied(ing, rawSet, hasRecipeBuilding, visited)) }
					: { status: 'blueprint', goods: chain };
			};

			// One row of slot chips; a covered chip made from a recipe folds its sub-recipe (click to open).
			// An open branch is an outline in its top-level slot's colour.
			const IngredientTree = ({ goodName, currentRawResources, hasRecipeBuilding, slotColor = null, visited = new Set() }) => {
				const [openSlots, setOpenSlots] = useState([]);
				const rawSet = new Set(currentRawResources);
				const good = GOODS[goodName];
				const sets = (good && good.ingredient_sets) || [];
				const branchVisited = new Set(visited).add(goodName);
				const isTop = slotColor === null;
				const satisfiers = sets.map(group => pickSlotIngredient(group, rawSet, hasRecipeBuilding, branchVisited));
				const shownGoods = sets.map((group, i) => satisfiers[i] || (group.length === 1 ? group[0] : null));
				// Opened chips are remembered by slot and good ("0:Fabric"). Once a slot shows a different
				// good, its key is forgotten, so coming back to the first good starts folded again.
				const foldKeys = shownGoods.map((shown, i) => `${i}:${shown}`);
				const foldKeysId = foldKeys.join('|');
				useEffect(() => {
					setOpenSlots(prev => {
						const kept = prev.filter(key => foldKeys.includes(key));
						return kept.length === prev.length ? prev : kept;
					});
				}, [foldKeysId]);
				if (sets.length === 0) return null;

				return (
