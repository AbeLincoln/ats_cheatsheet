					<div className={`ingredient-tree${isTop ? ' ingredient-tree-top' : ''}`}>
						{sets.map((group, i) => {
							const satisfier = satisfiers[i];
							const shown = shownGoods[i];
							// The chip names its good; its badge counts and lists the alternatives
							const tooltip = shown && GOODS[shown] && GOODS[shown].displayName;
							const colorIndex = isTop ? i : slotColor;
							const palette = isTop ? INGREDIENT_GROUP_COLORS : INGREDIENT_GROUP_COLORS_NESTED;
							const hasSubRecipe = shown && !isRawResource(shown) && !branchVisited.has(shown);
							const foldable = isTop && satisfier && hasSubRecipe;
							const foldKey = foldKeys[i];
							const open = hasSubRecipe && (!foldable || openSlots.includes(foldKey));
							// An open chip's hammer lists only its own blueprint; the goods below carry theirs
							const slot = satisfier && slotBadge(group, satisfier, rawSet, hasRecipeBuilding, branchVisited);
							const badge = !slot || slot.status === 'done' || !open ? slot
								: !hasRecipeBuilding.includes(satisfier) ? { status: 'blueprint', goods: [satisfier] }
								: null;
							const toggle = () => setOpenSlots(prev => prev.includes(foldKey) ? prev.filter(k => k !== foldKey) : [...prev, foldKey]);
							// A chip that folds opens and closes its sub-recipe; any other chip selects its good in the grid
							const foldProps = foldable ? {
								role: 'button',
								tabIndex: 0,
								'aria-expanded': open,
								onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } },
							} : {};
							// The badge sits beside the chip, not inside it, so a chip that acts as a button
							// doesn't hold a second focusable control
							return (
								<div key={i} className="ingredient-branch">
									<div className="ingredient-slot">
										<div
											className={`ingredient-group-box${shown && !satisfier ? ' ingredient-missing' : ''}${foldable ? ' ingredient-foldable' : ''}${tooltip ? ' hover-tip' : ''}`}
											style={{ backgroundColor: palette[colorIndex] || palette[0] }}
											data-tooltip={tooltip || undefined}
											onClick={() => foldable ? toggle() : shown && selectInGrid(shown)}
											{...foldProps}
										>
											{shown && GOODS[shown] && (
												<img src={GOODS[shown].icon_path} alt={GOODS[shown].displayName} />
											)}
										</div>
										{badge && <StatusBadge status={badge.status} goods={badge.goods} />}
									</div>
									{open && (
										<IngredientTree
											goodName={shown}
											currentRawResources={currentRawResources}
											hasRecipeBuilding={hasRecipeBuilding}
											slotColor={colorIndex}
											visited={branchVisited}
										/>
									)}
								</div>
							);
						})}
					</div>
				);
			};

			// Phone cards: one entry per recipe slot, in its colour. One icon with a check is ready, one with a
			// hammer needs the blueprints it counts, and several icons are the options for a missing slot.
			const SlotEntries = ({ need, currentRawResources, hasRecipeBuilding, hasServiceBuilding }) => {
				const goodName = NEEDTRANS[need] || need;
				const good = GOODS[goodName];
				if (!good || !good.ingredient_sets) return null;
				const rawSet = new Set(currentRawResources);
				const visited = new Set([goodName]);
				const entries = [];
				if (isServiceBuildingMissing(need, hasServiceBuilding)) {
					entries.push(
						<span key="service" className="look-out-for-group look-out-for-service"><ServiceBuildingIcons need={need} /></span>
					);
				}
				good.ingredient_sets.forEach((group, i) => {
					const color = INGREDIENT_GROUP_COLORS[i] || INGREDIENT_GROUP_COLORS[0];
					const satisfier = pickSlotIngredient(group, rawSet, hasRecipeBuilding, visited);
					if (satisfier) {
						entries.push(
							<span key={i} className="look-out-for-group" style={{ backgroundColor: color }}>
								<span className="look-out-icon slot-used">
									<img src={GOODS[satisfier].icon_path} alt={GOODS[satisfier].displayName} title={GOODS[satisfier].displayName}
										width="24" height="24" onClick={() => selectInGrid(satisfier)} />
									<StatusBadge {...slotBadge(group, satisfier, rawSet, hasRecipeBuilding, visited)} />
								</span>
							</span>
						);
						return;
					}
					const only = group.length === 1 ? group[0] : null;
					if (only && !isRawResource(only) && GOODS[only] && GOODS[only].ingredient_sets) {
						const nested = INGREDIENT_GROUP_COLORS_NESTED[i] || INGREDIENT_GROUP_COLORS_NESTED[0];
						const missing = getMissingSlots(only, currentRawResources);
						entries.push(
							<span key={i} className="look-out-for-group" style={{ backgroundColor: color }}>
								<LookOutIcon good={only} onClick={() => selectInGrid(only)}
									hammer={!hasRecipeBuilding.includes(only)} needs={missing} />
								{missing.map((sub, k) => (
									<span key={k} className="look-out-for-group slot-nested" style={{ backgroundColor: nested }}><OptionIcons options={sub} currentRawResources={currentRawResources} hasRecipeBuilding={hasRecipeBuilding} /></span>
								))}
							</span>
						);
						return;
					}
					entries.push(
						<span key={i} className="look-out-for-group" style={{ backgroundColor: color }}><OptionIcons options={group} currentRawResources={currentRawResources} hasRecipeBuilding={hasRecipeBuilding} /></span>
					);
				});
				return <div className="slot-entries">{entries}</div>;
			};

			// A group heading inside a side list. On phones (below a 460px frame) the lists sit above
			// the table as four equal sections, and each heading also says how many are ticked.
			const SuggestorSectionHeading = ({ title, items, ticked, className = '' }) => (
				<div className={`suggestor-subheading ${className}`}>
					{title}
					<span className="suggestor-section-count">{items.filter(item => ticked.includes(item)).length} of {items.length} ticked</span>
				</div>
			);

			const SuggestorContent = () => {
				const [savedSuggestorState] = useState(loadSavedState); // read once, for the initial values
				const speciesNames = Object.keys(SPECIES);
				const recipeBuildingGoods = [...TRANSITIONAL_FOR_NEEDED, ...NEEDED_GOODS];
				const [currentRawResources, setCurrentRawResources] = useState(Array.isArray(savedSuggestorState.suggestorRawResources)
					? savedSuggestorState.suggestorRawResources.filter(resource => RAW_RESOURCES.includes(resource))
					: []);
				// Species come from the Species Needs grid above, like Best Buildings
				const toActiveSpecies = (selection) => selection && selection.length ? selection : null;
				const [activeSpecies, setActiveSpecies] = useState(toActiveSpecies(window.currentSpeciesSelection));
				const [hasRecipeBuilding, setHasRecipeBuilding] = useState(Array.isArray(savedSuggestorState.suggestorRecipeBuildings)
					? savedSuggestorState.suggestorRecipeBuildings.filter(good => recipeBuildingGoods.includes(good))
					: []);
				const [hasServiceBuilding, setHasServiceBuilding] = useState(Array.isArray(savedSuggestorState.suggestorServiceBuildings)
					? savedSuggestorState.suggestorServiceBuildings.filter(building => SERVICE_BUILDINGS.includes(building))
					: []);

				useEffect(() => saveState({ suggestorRawResources: currentRawResources }), [currentRawResources]);
				useWindowEvent('speciesSelection', (e) => setActiveSpecies(toActiveSpecies(e.detail)));
				useEffect(() => saveState({ suggestorRecipeBuildings: hasRecipeBuilding }), [hasRecipeBuilding]);
				useEffect(() => saveState({ suggestorServiceBuildings: hasServiceBuilding }), [hasServiceBuilding]);

				const handleRecipeBuildingChange = (good) => {
					setHasRecipeBuilding(prev => prev.includes(good) ? prev.filter(g => g !== good) : [...prev, good]);
				};

				const handleServiceBuildingChange = (buildingId) => {
					setHasServiceBuilding(prev => prev.includes(buildingId) ? prev.filter(b => b !== buildingId) : [...prev, buildingId]);
				};

				const handleCheckboxChange = (resource) => {
					setCurrentRawResources(prev => {
						if (prev.includes(resource)) {
							return prev.filter(r => r !== resource);
						} else {
							return [...prev, resource];
						}
					});
				};

				const isSpeciesLit = (species) => !activeSpecies || activeSpecies.includes(species);
				const isNeedRowDimmed = (need) => {
					if (!activeSpecies) return false;
					const needSpecies = overlappingNeeds[need] || [];
					return needSpecies.length > 0 && needSpecies.every(s => !activeSpecies.includes(s));
				};

				// The phone cards' slot entries are only built while the cards show (below a 460px frame)
				const showCards = usePageNarrowerThan(460);

				return (
					<div>
						<div className="ats-container icon-grid" style={{ maxWidth: '1200px', marginBottom: '15px' }}>
							<div className="grid-header ats-infobox-header-title">
								Suggestor
								<SacredGroveWarning count={activeSpecies ? activeSpecies.length : 0} />
							</div>
							<div className="icon-grid-wrapper">
								{/* The same species picker as Best Buildings */}
								<div className="affinity-picker">
									<span className="affinity-label" title="Needs wanted by the selected species come first. Follows the selection in the Species Needs grid above.">Species:</span>
									{speciesNames.map(species => (
										<img key={species} src={SPECIES_ICONS[species]} alt={species} title={species}
											className={`affinity-portrait${activeSpecies && activeSpecies.includes(species) ? ' affinity-active' : ''}`}
											onClick={() => selectInGrid(species)} />
									))}
								</div>
							</div>
						</div>
						{/* Three areas (CSS grid): side by side on wide screens; narrower, the two lists sit above the table */}
						<div className="ats-container suggestor-main">
							<div className="suggestor-side suggestor-raw">
								{/* Narrower than a 1010px frame the list narrows and the heading shortens to one word */}
								<div className="grid-header ats-infobox-header-title">
									<span className="suggestor-side-long">Raw resources</span>
									<span className="suggestor-side-short">Resources</span>
								</div>
								<div className="icon-grid-wrapper">
									<div className="suggestor-list">
										{/* Phones only, where the list's own heading above is hidden */}
										<SuggestorSectionHeading title="Raw resources" items={RAW_RESOURCES} ticked={currentRawResources}
											className="suggestor-subheading-raw" />
										{RAW_RESOURCES.map(resource => (
											<label key={resource} className="suggestor-raw-resource">
												<input
													type="checkbox"
													checked={currentRawResources.includes(resource)}
													onChange={() => handleCheckboxChange(resource)}
												/>
												{GOODS[resource] && (
													<img
														src={GOODS[resource].icon_path}
														alt={GOODS[resource].displayName}
														title={GOODS[resource].displayName}
														onClick={() => selectInGrid(resource)}
													/>
												)}
												<span>{GOODS[resource] ? GOODS[resource].displayName : resource}</span>
											</label>
										))}
									</div>
								</div>
							</div>
							<div className="suggestor-suggested-need">
								<div className="grid-header ats-infobox-header-title">Suggested Need</div>
								<div className="icon-grid-wrapper">
									<table className="data-table suggestor-data-table suggestor-table">
										<thead>
											<tr>
												<th>Needed Good</th>
												<th>Species</th>
												<th>Look out for</th>
											</tr>
										</thead>
										<tbody>
											{getSortedNeeds(activeSpecies, currentRawResources, hasRecipeBuilding, hasServiceBuilding).map(need => (
												<tr key={need} className={isNeedRowDimmed(need) ? 'suggestor-row-dimmed' : ''}>
													<td>
														<div className="item-cell">
															<img
																className="item-icon"
																src={SPECIES_ICONS[need] || (NEEDTRANS[need] && GOODS[NEEDTRANS[need]] && GOODS[NEEDTRANS[need]].icon_path)}
																alt={need}
																onClick={() => selectInGrid(NEEDTRANS[need] || need)}
															/>
															<StatusBadge {...getCardStatus(need, currentRawResources, hasRecipeBuilding, hasServiceBuilding)} />
															<span className="item-name">{need}</span>
														</div>
														<IngredientTree
															goodName={NEEDTRANS[need] || need}
															currentRawResources={currentRawResources}
															hasRecipeBuilding={hasRecipeBuilding}
														/>
													</td>
													<td>
														{/* Species that want this need: portraits only (names on hover); unselected ones dimmed */}
														<div className="species-strip">
															{overlappingNeeds[need] && overlappingNeeds[need].map((species) => (
																<img key={species} className={!isSpeciesLit(species) ? 'suggestor-dimmed-portrait' : ''}
																	onClick={() => selectInGrid(species)} alt={species} title={species} src={SPECIES_ICONS[species]} width="30" height="30"/>
															))}
														</div>
													</td>
													<td>
														{getLookOutFor(NEEDTRANS[need] || need, currentRawResources, hasRecipeBuilding, need, hasServiceBuilding).map((s, idx) => (
															<div key={idx} className="look-out-for-item">
																{s.type === 'service_building' ? (
																	<span className="look-out-for-group look-out-for-service">
																		<span className="look-out-label">One of </span>
																		<ServiceBuildingIcons need={s.need} />
																	</span>
																) : s.type === 'blueprint' ? (
																	<span
																		className="look-out-for-group look-out-for-blueprint"
																		style={s.color ? { backgroundColor: s.color } : undefined}
																	>
																		<span className="look-out-label">Recipes for </span>
																		{s.goods.filter(g => GOODS[g]).map(g => (
																			<LookOutIcon key={g} good={g} hammer onClick={() => selectInGrid(g)} />
																		))}
																	</span>
																) : (
																	// type 'slot': the options for a slot that can't be covered, raw or made
																	<span
																		className="look-out-for-group"
																		style={{ backgroundColor: s.color }}
																	>
																		<span className="look-out-label">One of </span>
																		<OptionIcons options={s.options} currentRawResources={currentRawResources} hasRecipeBuilding={hasRecipeBuilding} />
																	</span>
																)}
															</div>
														))}
														{/* Phone cards show these instead of the ingredient chips and the lines above */}
														{showCards && <SlotEntries need={need} currentRawResources={currentRawResources} hasRecipeBuilding={hasRecipeBuilding}
															hasServiceBuilding={hasServiceBuilding} />}
													</td>
												</tr>
											))}
										</tbody>
									</table>
								</div>
							</div>
							<div className="suggestor-side suggestor-have">
								<div className="grid-header ats-infobox-header-title">
									<span className="suggestor-side-long">Have Blueprints</span>
									<span className="suggestor-side-short">Blueprints</span>
								</div>
								<div className="icon-grid-wrapper">
									<div className="suggestor-list">
										<SuggestorSectionHeading title="Transitional" items={TRANSITIONAL_FOR_NEEDED} ticked={hasRecipeBuilding} />
										{TRANSITIONAL_FOR_NEEDED.map(good => (
											<label key={good} className="suggestor-raw-resource">
												<input
													type="checkbox"
													checked={hasRecipeBuilding.includes(good)}
													onChange={() => handleRecipeBuildingChange(good)}
												/>
												{GOODS[good] && (
													<img
														src={GOODS[good].icon_path}
														alt={GOODS[good].displayName}
														title={GOODS[good].displayName}
														onClick={() => selectInGrid(good)}
														style={{ cursor: 'pointer' }}
													/>
												)}
												<span>{GOODS[good] ? GOODS[good].displayName : good}</span>
											</label>
										))}
										<SuggestorSectionHeading title="Needed goods" items={NEEDED_GOODS} ticked={hasRecipeBuilding} />
										{NEEDED_GOODS.map(good => (
											<label key={good} className="suggestor-raw-resource">
												<input
													type="checkbox"
													checked={hasRecipeBuilding.includes(good)}
													onChange={() => handleRecipeBuildingChange(good)}
												/>
												{GOODS[good] && (
													<img
														src={GOODS[good].icon_path}
														alt={GOODS[good].displayName}
														title={GOODS[good].displayName}
														onClick={() => selectInGrid(good)}
														style={{ cursor: 'pointer' }}
													/>
												)}
												<span>{GOODS[good] ? GOODS[good].displayName : good}</span>
											</label>
										))}
										<SuggestorSectionHeading title="Service Buildings" items={SERVICE_BUILDINGS} ticked={hasServiceBuilding} />
										{SERVICE_BUILDINGS.map(bid => (
											<label key={bid} className="suggestor-raw-resource">
												<input
													type="checkbox"
													checked={hasServiceBuilding.includes(bid)}
													onChange={() => handleServiceBuildingChange(bid)}
												/>
												{BUILDINGS[bid] && (
													<img
														src={BUILDINGS[bid].icon}
														alt={BUILDINGS[bid].displayName}
														title={BUILDINGS[bid].displayName}
														style={{ cursor: 'pointer' }}
													/>
												)}
												<span>{BUILDINGS[bid] ? BUILDINGS[bid].displayName : bid}</span>
											</label>
										))}
									</div>
								</div>
							</div>
						</div>
					</div>
				);
			};

			// The products that count towards a building's score: who needs each, and its share
			const scoreParts = (item, species) => item.products
				.map(p => ({ p, liked: productLikedBy(p.id, species), mult: 1 + gradeStars(p.grade) }))
				.filter(x => x.liked.length > 0);

			// Spoken version of the score tooltip, for screen readers
			const scoreLabel = (item, species, score) => [
				`Score ${score}`,
				...scoreParts(item, species).map(({ p, liked, mult }) =>
					`${p.name}${p.grade ? ` ${gradeLabel(p.grade)}` : ''}, needed by ${liked.join(', ')}: ${liked.length} × ${mult} = ${liked.length * mult}`),
			].join('. ');

			// Per-product breakdown of a building's score
			const ScoreTip = ({ item, species, score }) => (
				<React.Fragment>
					{scoreParts(item, species).map(({ p, liked, mult }) => (
						<span key={p.name} className="tip-row">
							<img src={p.icon_path} alt="" />{p.name}{p.grade ? ` ${p.grade}` : ''}:
							{liked.map(s => <img key={s} src={SPECIES_ICONS[s]} alt={s} />)}
							{` ${liked.length} × ${mult} = ${liked.length * mult}`}
						</span>
					))}
					<span className="tip-row tip-total">Score {score}: species that need it × (stars + 1)</span>
				</React.Fragment>
			);

			// The game shows these building tags as icons, not names (icons from the wiki's species pages)
			const SPECIALIZATION_ICONS = {
				'Farming': 'img/specializations/Icon_Spec_Farm_64x64.png',
				'Woodworking': 'img/specializations/Icon_Spec_Wood_64x64.png',
				'Meat production': 'img/specializations/Icon_Spec_Meat_64x64.png',
				'Alchemy': 'img/specializations/Icon_Spec_Alchemy_64x64.png',
				'Masonry': 'img/specializations/Icon_Spec_Masonry.png',
				'Metallurgy': 'img/specializations/Icon_Spec_Metallurgy_64x64.png',
				'Brewing': 'img/specializations/Icon_Spec_Brewing_64x64.png',
				'Engineering': 'img/specializations/Icon_Spec_Gear_64x64.png',
				'Warmth': 'img/specializations/Icon_Spec_Fire_64x64.png',
				'Tailoring': 'img/specializations/Icon_Spec_Cloth_64x64.png',
				'Cooperation': 'img/specializations/Icon_Spec_Cooperation_64x64.png',
				'Rainwater': 'img/specializations/Icon_Spec_RainWater_64x64.png',
			};

			const PROFICIENCY_EFFECT = '10% chance of double yield';
			const comfortEffect = (s) => s === 'Fox'
				? '+5 Resolve when 3 or more Foxes work here'
				: '+5 Resolve while working here';

			// A species' portrait under a building's name, with its worker bonuses in the corner:
			// gears for proficiency, a heart for comfort
			const WorkerBonus = ({ species, proficient, comforted }) => {
				const lines = [
					proficient && { icon: 'fa-gears', kind: 'proficiency', tag: SPECIES_PROFICIENCY[species], effect: PROFICIENCY_EFFECT },
					comforted && { icon: 'fa-heart', kind: 'comfort', tag: SPECIES_COMFORT[species], effect: comfortEffect(species) },
				].filter(Boolean);
				return (
					<span className="worker-bonus">
						<img src={SPECIES_ICONS[species]} alt={species} />
						<Badge className="worker-bonus-badge"
							label={lines.map(l => `${species} ${l.kind} (${l.tag}): ${l.effect}`).join('. ')}
							tip={lines.map(l => (
								<span key={l.icon} className="tip-row">
									<i className={`fa-solid ${l.icon}`} aria-hidden="true"></i>
									{species} {l.kind}
									<span className="spec-tag"><img className="spec-icon" src={SPECIALIZATION_ICONS[l.tag]} alt={l.tag} title={l.tag} />:</span>
									{l.effect}
								</span>
							))}>
							{lines.map(l => <i key={l.icon} className={`fa-solid ${l.icon}`} aria-hidden="true"></i>)}
						</Badge>
					</span>
				);
			};

			// Best buildings for the species selected in the Species Needs grid above
			const BestBuildings = () => {
				const [species, setSpecies] = useState(window.currentSpeciesSelection || []);
				// Earlier versions saved this as includeFlawless
				const [includeRuins, setIncludeRuins] = useState(() => {
					const saved = loadSavedState();
					return typeof saved.includeRuins === 'boolean' ? saved.includeRuins : saved.includeFlawless === true;
				});

				useWindowEvent('speciesSelection', (e) => setSpecies(e.detail || []));

				useEffect(() => saveState({ includeRuins, includeFlawless: undefined }), [includeRuins]);

				const ranked = FORMATTED_BUILDINGS
					.filter(item => (includeRuins || !isCleansedRuin(item.building))
						&& (hasLikedProduct(item, species) || workerBonusCount(item, species) > 0))
					.sort((a, b) =>
						affinityScore(b, species) - affinityScore(a, species)
						|| workerBonusCount(b, species) - workerBonusCount(a, species)
						|| (a.building < b.building ? -1 : a.building > b.building ? 1 : 0));

				return (
					<div className="ats-container icon-grid best-buildings">
						<div className="grid-header ats-infobox-header-title">
							{"Best Buildings"}
							<SacredGroveWarning count={species.length} />
						</div>
						<div className="icon-grid-wrapper">
							<div className="affinity-picker">
								<span className="affinity-label" title="Buildings ranked by how well their output matches the selected species' needs. Follows the selection in the Species Needs grid above.">Species:</span>
								{Object.keys(SPECIES).map(s => (
									<img key={s} src={SPECIES_ICONS[s]} alt={s} title={s}
										className={`affinity-portrait${species.includes(s) ? ' affinity-active' : ''}`}
										onClick={() => selectInGrid(s)} />
								))}
								<button type="button"
									aria-pressed={includeRuins}
									title="Include the one-of-a-kind buildings from cleansing Haunted Ruins (Flawless, Holy, Hallowed and Purified versions) in the rankings"
									className={`ruins-toggle${includeRuins ? ' ruins-toggle-active' : ''}`}
									onClick={() => setIncludeRuins(current => !current)}>
									Haunted Ruins: {includeRuins ? 'On' : 'Off'}
								</button>
							</div>
							{species.length === 0 ?
								<div className="affinity-hint">Select up to 4 species (4 requires Sacred Grove; here or in the Species Needs grid) to rank buildings by how well their products and worker bonuses match those species.</div>
							:
								<table className="data-table buildings-table best-table">
									<thead>
										<tr>
											<th>Building</th>
											<th>Products</th>
											<th><span className="cost-header-building">Building </span>Cost</th>
										</tr>
									</thead>
									<tbody>
										{ranked.map(item => {
											const score = affinityScore(item, species);
											const proficient = proficientSpecies(item, species);
											const comforted = comfortedSpecies(item, species);
											const bonusSpecies = species.filter(s => proficient.includes(s) || comforted.includes(s));
											return (
											<tr key={item.id}>
												<td>
													<div className="building-cell">
														<span className="icon-with-score">
															<img className="building-icon" src={item.icon} alt={item.building} />
															<Badge className="best-score" label={scoreLabel(item, species, score)} tip={<ScoreTip item={item} species={species} score={score} />}>
																{score}
															</Badge>
														</span>
														<div className="building-text">
															<span className="building-name">{item.building}</span>
															{bonusSpecies.length > 0 &&
																<span className="bonus-row">
																	{bonusSpecies.map(s => (
																		<WorkerBonus key={s} species={s}
																			proficient={proficient.includes(s)}
																			comforted={comforted.includes(s)} />
																	))}
																</span>
															}
														</div>
													</div>
												</td>
												<td>
													{item.products.map((productItem, productIndex) => {
														const likedBy = productLikedBy(productItem.id, species);
														return (
														  <ProductLine key={productIndex} product={productItem} unwanted={likedBy.length === 0}>
															{likedBy.length > 0 && <span className="need-portraits">{likedBy.map(s => (
																<img key={s} src={SPECIES_ICONS[s]} alt={s} title={`${speciesPlural(s)} need this`} className="need-portrait"/>
															))}</span>}
														  </ProductLine>
														);
													})}
												</td>
												<td>
													{item.cost.map((costItem, costIndex) => (
													  <CostLine key={costIndex} cost={costItem} />
													))}
												</td>
											</tr>
											);
										})}
									</tbody>
								</table>
							}
						</div>
					</div>
				);
			};

			const TABS = [
				{ id: 'buildings-table', label: 'Buildings', content: <DataTable /> },
				{ id: 'suggestor', label: 'Suggestor', content: <SuggestorContent /> },
				{ id: 'best-buildings', label: 'Best Buildings', content: <BestBuildings /> },
			];

			const TabsComponent = () => {
				const savedActiveTab = loadSavedState().activeTab;
				const [activeTab, setActiveTab] = useState(TABS.some(tab => tab.id === savedActiveTab) ? savedActiveTab : TABS[0].id);

				useEffect(() => saveState({ activeTab }), [activeTab]);

				return (
					<div className="tabs-panel">
						<div className="tabs">
							{TABS.map(tab => (
								<button
									key={tab.id}
									className={`tab ${activeTab === tab.id ? 'active' : ''}`}
									onClick={() => setActiveTab(tab.id)}
								>
									{tab.label}
								</button>
							))}
						</div>
						<div className="state-tools">
							<button type="button" className="state-reset" onClick={resetSavedState}>Reset saved state</button>
						</div>
						<div className="tab-content">
							{TABS.find(tab => tab.id === activeTab).content}
						</div>
					</div>
				);
			};

			// Replace ReactDOM.render with this:
			ReactDOM.render(<TabsComponent />, document.querySelector("#block_2"));
        </script>
    </div>
</body>
</html>
