											style={{ cursor: 'pointer' }}
										>
											<img src={SPECIES_ICONS[species]} alt={species} title={species} />
										</div>
									))}
								</div>
							</div>
						</div>
						{/* Three areas (CSS grid): side by side on wide screens; narrower, the two lists sit above the table */}
						<div className="ats-container suggestor-main">
							<div className="suggestor-side suggestor-raw">
								<div className="grid-header ats-infobox-header-title">Raw resources</div>
								<div className="icon-grid-wrapper">
									<div className="suggestor-list">
										{RAW_RESOURCES.map(resource => (
											<label key={resource} className="suggestor-raw-resource">
												<input
													type="checkbox"
													checked={currentRawResources.includes(resource)}
													onChange={() => handleCheckboxChange(resource)}
												/>
												{GOODS[resource] && (
													<img
														src={GOODS[resource].icon_path}
														alt={GOODS[resource].displayName}
														title={GOODS[resource].displayName}
														onClick={() => handleIconClick(resource)}
													/>
												)}
												<span>{GOODS[resource] ? GOODS[resource].displayName : resource}</span>
											</label>
										))}
									</div>
								</div>
							</div>
							<div className="suggestor-suggested-need">
								<div className="grid-header ats-infobox-header-title">Suggested Need</div>
								<div className="icon-grid-wrapper">
									<table className="data-table suggestor-data-table suggestor-table">
										<thead>
											<tr>
												<th>Needed Good</th>
												<th>Species</th>
												<th>Look out for</th>
											</tr>
										</thead>
										<tbody>
											{getSortedNeeds(activeSpecies, currentRawResources, hasRecipeBuilding, hasServiceBuilding).map(need => (
												<tr key={need} className={isNeedRowDimmed(need) ? 'suggestor-row-dimmed' : ''}>
													<td>
														<div className="item-cell">
															<img
																className="item-icon"
																src={SPECIES_ICONS[need] || (NEEDTRANS[need] && GOODS[NEEDTRANS[need]] && GOODS[NEEDTRANS[need]].icon_path)}
																alt={need}
																onClick={() => handleIconClick(NEEDTRANS[need] || need)}
															/>
															<StatusBadge {...getCardStatus(need, currentRawResources, hasRecipeBuilding, hasServiceBuilding)} />
															<span className="item-name">{need}</span>
														</div>
														<IngredientTree
															goodName={NEEDTRANS[need] || need}
															currentRawResources={currentRawResources}
															hasRecipeBuilding={hasRecipeBuilding}
															handleIconClick={handleIconClick}
														/>
													</td>
													<td>
														{/* Species that want this need: portraits only (names on hover); unselected ones dimmed */}
														<div className="species-strip">
															{overlappingNeeds[need] && overlappingNeeds[need].map((species) => (
																<img key={species} className={!isSpeciesLit(species) ? 'suggestor-dimmed-portrait' : ''}
																	onClick={() => handleIconClick(species)} alt={species} title={species} src={SPECIES_ICONS[species]} width="30" height="30"/>
															))}
														</div>
													</td>
													<td>
														{getLookOutFor(NEEDTRANS[need] || need, currentRawResources, hasRecipeBuilding, need, hasServiceBuilding).map((s, idx) => (
															<div key={idx} className="look-out-for-item">
																{s.type === 'service_building' ? (
																	<span className="look-out-for-group look-out-for-service">
																		<span>One of </span>
																		{(NEED_TO_SERVICE_BUILDINGS[s.need] || []).filter(bid => BUILDINGS[bid]).map(bid => (
																			<img
																				key={bid}
																				className="service-building-icon"
																				src={BUILDINGS[bid].icon}
																				alt={BUILDINGS[bid].displayName}
																				title={BUILDINGS[bid].displayName}
																				width="24"
																				height="24"
																			/>
																		))}
																	</span>
																) : s.type === 'blueprint' ? (
																	<span
																		className="look-out-for-group look-out-for-blueprint"
																		style={s.colorAlpha ? { backgroundColor: s.colorAlpha } : undefined}
																	>
																		<span>Recipes for </span>
																		{s.goods.filter(g => GOODS[g]).map(g => (
																			<LookOutIcon key={g} good={g} hammer onClick={() => handleIconClick(g)} />
																		))}
																	</span>
																) : (
																	// type 'slot': the options for a slot that can't be covered, raw or made
																	<span
																		className="look-out-for-group"
																		style={{ backgroundColor: s.colorAlpha }}
																	>
																		<span>One of </span>
																		{s.options.filter(ing => GOODS[ing]).map(ing => (
																			<LookOutIcon key={ing} good={ing} onClick={() => handleIconClick(ing)}
																				hammer={!isRawResource(ing) && !hasRecipeBuilding.includes(ing)}
																				needs={getMissingSlots(ing, currentRawResources)} />
																		))}
																	</span>
																)}
															</div>
														))}
													</td>
												</tr>
											))}
										</tbody>
									</table>
								</div>
							</div>
							<div className="suggestor-side suggestor-have">
								<div className="grid-header ats-infobox-header-title">Have Blueprints</div>
								<div className="icon-grid-wrapper">
									<div className="suggestor-list">
										<div className="suggestor-subheading">Transitional</div>
										{TRANSITIONAL_FOR_NEEDED.map(good => (
											<label key={good} className="suggestor-raw-resource">
												<input
													type="checkbox"
													checked={hasRecipeBuilding.includes(good)}
													onChange={() => handleRecipeBuildingChange(good)}
												/>
												{GOODS[good] && (
													<img
														src={GOODS[good].icon_path}
														alt={GOODS[good].displayName}
														title={GOODS[good].displayName}
														onClick={() => handleIconClick(good)}
														style={{ cursor: 'pointer' }}
													/>
												)}
												<span>{GOODS[good] ? GOODS[good].displayName : good}</span>
											</label>
										))}
										<div className="suggestor-subheading">Needed goods</div>
										{NEEDED_GOODS.map(good => (
											<label key={good} className="suggestor-raw-resource">
												<input
													type="checkbox"
													checked={hasRecipeBuilding.includes(good)}
													onChange={() => handleRecipeBuildingChange(good)}
												/>
												{GOODS[good] && (
													<img
														src={GOODS[good].icon_path}
														alt={GOODS[good].displayName}
														title={GOODS[good].displayName}
														onClick={() => handleIconClick(good)}
														style={{ cursor: 'pointer' }}
													/>
												)}
												<span>{GOODS[good] ? GOODS[good].displayName : good}</span>
											</label>
										))}
										<div className="suggestor-subheading">Service Buildings</div>
										{SERVICE_BUILDINGS.map(bid => (
											<label key={bid} className="suggestor-raw-resource">
												<input
													type="checkbox"
													checked={hasServiceBuilding.includes(bid)}
													onChange={() => handleServiceBuildingChange(bid)}
												/>
												{BUILDINGS[bid] && (
													<img
														src={BUILDINGS[bid].icon}
														alt={BUILDINGS[bid].displayName}
														title={BUILDINGS[bid].displayName}
														style={{ cursor: 'pointer' }}
													/>
												)}
												<span>{BUILDINGS[bid] ? BUILDINGS[bid].displayName : bid}</span>
											</label>
										))}
									</div>
								</div>
							</div>
						</div>
					</div>
				);
			};

			// Best buildings for the species selected in the Species Needs grid above
			const BestBuildings = () => {
				const [species, setSpecies] = useState(window.currentSpeciesSelection || []);
				const [includeFlawless, setIncludeFlawless] = useState(loadSavedState().includeFlawless === true);

				useWindowEvent('speciesSelection', (e) => setSpecies(e.detail || []));

				useEffect(() => saveState({ includeFlawless }), [includeFlawless]);

				// Toggle through the Species Needs grid so both stay in sync
				const toggleSpecies = (name) => {
					const gridIcon = document.getElementById(name);
					if (gridIcon) gridIcon.click();
				};

				const handleIconClick = (iconName) => {
					document.getElementById(iconName).click();
				};

				const ranked = FORMATTED_BUILDINGS
					.filter(item => (includeFlawless || !item.building.startsWith('Flawless '))
						&& (hasLikedProduct(item, species) || workerBonusCount(item, species) > 0))
					.sort((a, b) =>
						affinityScore(b, species) - affinityScore(a, species)
						|| workerBonusCount(b, species) - workerBonusCount(a, species)
						|| (a.building < b.building ? -1 : a.building > b.building ? 1 : 0));

				return (
					<div className="ats-container icon-grid" style={{ minWidth: '850px' }}>
						<div className="grid-header ats-infobox-header-title">
							{"Best Buildings"}
							<SacredGroveWarning count={species.length} />
						</div>
						<div className="icon-grid-wrapper">
							<div className="affinity-picker">
								<span className="affinity-label" title="Buildings ranked by how well their output matches the selected species' needs. Follows the selection in the Species Needs grid above.">Species:</span>
								{Object.keys(SPECIES).map(s => (
									<img key={s} src={SPECIES_ICONS[s]} alt={s} title={s}
										className={`affinity-portrait${species.includes(s) ? ' affinity-active' : ''}`}
										onClick={() => toggleSpecies(s)} />
								))}
								<button type="button"
									aria-pressed={includeFlawless}
									title="Include rare Flawless buildings in the rankings"
									className={`flawless-toggle${includeFlawless ? ' flawless-toggle-active' : ''}`}
									onClick={() => setIncludeFlawless(current => !current)}>
									Flawless: {includeFlawless ? 'On' : 'Off'}
								</button>
							</div>
							{species.length === 0 ?
								<div className="affinity-hint">Select up to 4 species (4 requires Sacred Grove; here or in the Species Needs grid) to rank buildings by how well their products and worker bonuses match those species.</div>
							:
								<table className="data-table">
									<thead>
										<tr>
											<th>Building</th>
											<th>Products</th>
											<th>Building Cost</th>
										</tr>
									</thead>
									<tbody>
										{ranked.map(item => (
											<tr key={item.id}>
												<td>
													<img src={item.icon} alt={item.building} style={{ maxWidth: '60px', maxHeight: '60px', margin: '10px' }} />
													{item.building}
													<span className="affinity-score" title={affinityBreakdown(item, species)}>{affinityScore(item, species)}</span>
													{proficientSpecies(item, species).length > 0 &&
														<span className="prof-badge" title={proficientSpecies(item, species).map(s => `${s} proficiency (${SPECIES_PROFICIENCY[s]}): 10% chance of double yield`).join('\n')}>
															{'⚒ '}
															{proficientSpecies(item, species).map(s => (
																<img key={s} src={SPECIES_ICONS[s]} alt={s} className="liked-badge"/>
															))}
														</span>
													}
													{comfortedSpecies(item, species).length > 0 &&
														<span className="comfort-badge" title={comfortedSpecies(item, species).map(s =>
															s === 'Fox'
																? `${s} comfort (${SPECIES_COMFORT[s]}): +5 Resolve when 3 or more Foxes work here`
																: `${s} comfort (${SPECIES_COMFORT[s]}): +5 Resolve while working here`
														).join('\n')}>
															{'♥ '}
															{comfortedSpecies(item, species).map(s => (
																<img key={s} src={SPECIES_ICONS[s]} alt={s} className="liked-badge"/>
															))}
														</span>
													}
												</td>
												<td>
													{item.products.map((productItem, productIndex) => (
													  <div key={productIndex}><img onClick={() => handleIconClick(productItem.name)} alt={productItem.name} src={productItem.icon_path} width="30" height="30"/> {productItem.name} {productItem.grade ? "(" + productItem.grade + ")" : ""}
														{productLikedBy(productItem.name, species).map(s => (
															<img key={s} src={SPECIES_ICONS[s]} alt={s} title={`${s}s need this`} className="liked-badge"/>
														))}
													  </div>
													))}
												</td>
												<td>
													{item.cost.map((costItem, costIndex) => (
													  <div key={costIndex}>{costItem.amount} <img alt={costItem.name} onClick={() => handleIconClick(costItem.name)} src={costItem.icon_path} width="30" height="30"/> {costItem.name}</div>
													))}
												</td>
											</tr>
										))}
									</tbody>
								</table>
							}
						</div>
					</div>
				);
			};

			const TABS = [
				{ id: 'buildings-table', label: 'Buildings', content: <DataTable /> },
				{ id: 'overlapping-needs', label: 'Needs Info', content: <OverlappingNeeds /> },
				{ id: 'suggestor', label: 'Suggestor', content: <SuggestorContent /> },
				{ id: 'best-buildings', label: 'Best Buildings', content: <BestBuildings /> },
			];

			const TabsComponent = () => {
				const savedActiveTab = loadSavedState().activeTab;
				const [activeTab, setActiveTab] = useState(TABS.some(tab => tab.id === savedActiveTab) ? savedActiveTab : TABS[0].id);

				useEffect(() => saveState({ activeTab }), [activeTab]);

				return (
					<div>
						<div className="tabs">
							{TABS.map(tab => (
								<button
									key={tab.id}
									className={`tab ${activeTab === tab.id ? 'active' : ''}`}
									onClick={() => setActiveTab(tab.id)}
								>
									{tab.label}
								</button>
							))}
						</div>
						<div className="state-tools">
							<button type="button" className="state-reset" onClick={resetSavedState}>Reset saved state</button>
						</div>
						<div className="tab-content">
							{TABS.find(tab => tab.id === activeTab).content}
						</div>
					</div>
				);
			};

			// Replace ReactDOM.render with this:
			ReactDOM.render(<TabsComponent />, document.querySelector("#block_2"));
        </script>
    </div>
</body>
</html>
